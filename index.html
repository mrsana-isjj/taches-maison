<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #FBF7EE;
    --carte: #FFFFFF;
    --texte: #24262B;
    --doux: #5E6470;
    --bord: #E4DDCD;
    --accent: #2F6F8F;
    --vert: #2E8B57;
    --vert-fond: #E3F3E9;
    --jaune: #B7791F;
    --jaune-fond: #FDF3DC;
    --rouge: #B83A3A;
    --ombre: 0 2px 8px rgba(40, 35, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #1E2024; --carte: #2A2D33; --texte: #EEEAE2; --doux: #B5B0A6; --bord: #3B3F47;
      --accent: #7DB8D6; --vert: #6CC891; --vert-fond: #24382C; --jaune: #E3B25B; --jaune-fond: #3A3222;
      --rouge: #E07B7B; --ombre: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); }
  body {
    font-family: 'Lexend', 'Verdana', sans-serif;   /* zéros non barrés */
    font-size: 20px; line-height: 1.6; letter-spacing: .02em; word-spacing: .08em;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3 { line-height: 1.3; margin: 0 0 .5em; }
  h2 { font-size: 1.25em; }
  h3 { font-size: 1.05em; }

  .app { max-width: 900px; margin: 0 auto; padding: 16px 16px 110px; }
  .entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .entete .date { color: var(--doux); font-size: .9em; }
  .moi { display: flex; align-items: center; gap: 10px; background: var(--carte); border: 2px solid var(--bord);
         border-radius: 999px; padding: 6px 16px 6px 8px; min-height: 52px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; flex: none; }

  .carte { background: var(--carte); border: 2px solid var(--bord); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--ombre); }
  .vide { color: var(--doux); text-align: center; padding: 24px 8px; }

  /* Choix du profil */
  .profils { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .profil { background: var(--carte); border: 3px solid var(--bord); border-radius: 20px; padding: 18px 10px;
            display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 600; font-size: 1.05em; }
  .profil .avatar { width: 76px; height: 76px; font-size: 44px; }

  /* Tâche */
  .tache { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .tache .nom { font-weight: 700; font-size: 1.1em; flex: 1 1 220px; }
  .tache .qui { color: var(--doux); font-size: .9em; font-weight: 400; display: block; }
  .bouton { border: none; border-radius: 14px; padding: 12px 20px; min-height: 56px; font-weight: 600;
            background: var(--accent); color: #fff; }
  .bouton.vert { background: var(--vert); }
  .bouton.leger { background: transparent; color: var(--texte); border: 2px solid var(--bord); }
  .bouton.danger { background: transparent; color: var(--rouge); border: 2px solid var(--rouge); }
  .bouton:disabled { opacity: .5; }
  .etat { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; padding: 10px 16px; font-weight: 600; min-height: 56px; }
  .etat.attente { background: var(--jaune-fond); color: var(--jaune); }
  .etat.valide { background: var(--vert-fond); color: var(--vert); }
  .etat.afaire { background: var(--fond); color: var(--doux); border: 2px dashed var(--bord); }
  .prochaine { color: var(--doux); font-size: .9em; margin-top: 4px; }

  /* Semaine */
  .grille-wrap { overflow-x: auto; }
  table.grille { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 560px; }
  .grille th { font-weight: 600; font-size: .8em; color: var(--doux); text-align: center; padding: 4px; }
  .grille th.jour-actuel { color: var(--accent); }
  .grille td { text-align: center; font-size: 1.2em; padding: 6px 2px; border-radius: 10px; background: var(--fond); }
  .grille td.tache-nom { text-align: left; font-size: .85em; font-weight: 600; background: none; padding-left: 0; }
  .grille td.jour-actuel { outline: 2px solid var(--accent); }
  .pastille { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px 2px 4px; font-size: .9em; font-weight: 600; }
  .pastille .avatar { width: 28px; height: 28px; font-size: 16px; }
  .legende { color: var(--doux); font-size: .85em; margin-top: 8px; }
  .liste-qui { display: grid; gap: 10px; }
  .ligne-qui { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Messages */
  .fil { display: flex; flex-direction: column; gap: 10px; }
  .bulle { max-width: 82%; padding: 10px 14px; border-radius: 16px; background: var(--carte); border: 2px solid var(--bord); }
  .bulle.de-moi { align-self: flex-end; }
  .bulle .auteur { font-weight: 700; font-size: .85em; }
  .bulle .heure { color: var(--doux); font-size: .75em; }
  .bulle .texte { white-space: pre-wrap; word-wrap: break-word; }
  .saisie { position: fixed; left: 0; right: 0; bottom: 84px; background: var(--fond); padding: 10px 16px; border-top: 2px solid var(--bord); }
  .saisie form { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
  .saisie input { flex: 1; min-height: 56px; border-radius: 14px; border: 2px solid var(--bord); padding: 0 14px; background: var(--carte); }

  /* Parents */
  .champ { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .champ input, .champ select, .ligne-admin input, .ligne-admin select {
    min-height: 52px; border-radius: 12px; border: 2px solid var(--bord); padding: 0 12px; background: var(--carte); }
  .ligne-admin { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 12px 0; border-bottom: 2px solid var(--bord); }
  .ligne-admin:last-child { border-bottom: none; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .bouton { min-height: 48px; padding: 8px 14px; }
  .case { display: inline-flex; align-items: center; gap: 8px; }
  .case input { width: 26px; height: 26px; }
  @media (min-width: 700px) {
    .ligne-admin { grid-template-columns: 1fr 170px 170px; align-items: center; }
    .ligne-admin .actions { grid-column: 1 / -1; }
  }

  /* Navigation */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--carte); border-top: 2px solid var(--bord); }
  nav .onglets { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav button { background: none; border: none; padding: 8px 4px 12px; min-height: 84px; display: flex; flex-direction: column;
               align-items: center; gap: 2px; font-size: .78em; font-weight: 600; color: var(--doux); position: relative; }
  nav button .ico { font-size: 1.8em; line-height: 1.2; }
  nav button.actif { color: var(--accent); }
  nav button.actif::before { content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 4px; border-radius: 0 0 4px 4px; background: var(--accent); }
  .badge { position: absolute; top: 8px; right: 22%; background: var(--rouge); color: #fff; border-radius: 999px; font-size: .75em; min-width: 22px; padding: 0 6px; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--texte); color: var(--fond);
           padding: 12px 20px; border-radius: 14px; font-weight: 600; z-index: 10; max-width: 90%; text-align: center; }
  body.avec-saisie .app { padding-bottom: 200px; }
  body.avec-saisie .toast { bottom: 180px; }
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .apercu { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 8px; }
  .apercu .avatar { width: 128px; height: 128px; font-size: 72px; border-width: 4px !important; }
  .choix-emoji { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
  .choix-emoji button { min-height: 60px; font-size: 32px; border-radius: 14px; border: 3px solid var(--bord); background: var(--carte); }
  .choix-emoji button.choisi, .couleurs button.choisi { border-color: var(--texte); }
  .couleurs { display: flex; flex-wrap: wrap; gap: 10px; }
  .couleurs button { width: 52px; height: 52px; border-radius: 50%; border: 4px solid transparent; }
  .points { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .points .score { font-size: 1.5em; font-weight: 700; }
  .barre { flex: 1 1 200px; height: 22px; border-radius: 999px; background: var(--fond); border: 2px solid var(--bord); overflow: hidden; }
  .barre span { display: block; height: 100%; background: var(--jaune); border-radius: 999px; }
  .barre.pleine span { background: var(--vert); }
  .gagne { background: var(--vert-fond); color: var(--vert); font-weight: 700; border-radius: 14px; padding: 12px 16px; margin-top: 12px; }
  .note-reprise { color: var(--doux); font-size: .9em; font-weight: 400; display: block; }
  .retrait-form { display: grid; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 14px; background: var(--fond); border: 2px solid var(--bord); }
  .retrait-form input, .retrait-form select { min-height: 52px; border-radius: 12px; border: 2px solid var(--bord); padding: 0 12px; background: var(--carte); }
  .moins { color: var(--rouge); font-weight: 700; }
  .clavier { max-width: 360px; margin: 0 auto; text-align: center; }
  .clavier .avatar { width: 96px; height: 96px; font-size: 54px; margin: 0 auto 8px; }
  .points-code { display: flex; justify-content: center; gap: 16px; margin: 18px 0; }
  .points-code span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--texte); }
  .points-code span.plein { background: var(--texte); }
  .touches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .touches button { min-height: 72px; font-size: 1.6em; font-weight: 700; border-radius: 18px; border: 2px solid var(--bord); background: var(--carte); }
  .secoue { animation: secoue .35s; }
  @keyframes secoue { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .changer { display: flex; align-items: center; gap: 6px; background: var(--carte); border: 2px solid var(--bord); border-radius: 999px;
             padding: 6px 14px; min-height: 52px; font-weight: 600; font-size: .85em; }
  .entete .droite { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  /* Accueil : tableau du jour */
  .accueil-titre { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .accueil-titre h1 { font-size: 1.4em; margin: 0; }
  .resume { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .resume span { border-radius: 999px; padding: 4px 14px; font-weight: 600; font-size: .9em; }
  .tableau { width: 100%; border-collapse: collapse; }
  .tableau td { padding: 12px 8px; border-bottom: 2px solid var(--bord); vertical-align: middle; }
  .tableau tr:last-child td { border-bottom: none; }
  .tableau .t-nom { font-weight: 700; font-size: 1.05em; }
  .tableau .t-etat { text-align: right; white-space: nowrap; }
  .tableau tr.fini .t-nom { color: var(--doux); text-decoration: line-through; text-decoration-thickness: 2px; }
  .puce { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 6px 12px; font-weight: 600; font-size: .9em; }
  .puce.afaire { border: 2px dashed var(--bord); color: var(--doux); }
  .puce.attente { background: var(--jaune-fond); color: var(--jaune); }
  .puce.valide { background: var(--vert-fond); color: var(--vert); }
  .profils.petits { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .profils.petits .profil { padding: 10px 6px; font-size: .95em; gap: 4px; }
  .profils.petits .profil .avatar { width: 56px; height: 56px; font-size: 32px; }
  .tableau .qui-mobile { display: none; }
  @media (max-width: 560px) {
    .tableau .t-etat .lib { display: none; }   /* sur petit écran : l'icône seule */
    .tableau td.t-qui { display: none; }        /* le prénom passe sous la tâche */
    .tableau .qui-mobile { display: block; margin-top: 6px; font-weight: 400; }
    .tableau td { padding: 10px 4px; }
  }
  .cache { display: none !important; }
  .chargement { text-align: center; padding: 60px 0; color: var(--doux); }
</style>
</head>
<body>
<div class="app" id="app"><div class="chargement">Chargement…</div></div>
<div class="saisie cache" id="saisie">
  <form id="formMessage" autocomplete="off">
    <input id="champMessage" maxlength="500" placeholder="Écris ton message…" aria-label="Message">
    <button class="bouton" type="submit">Envoyer</button>
  </form>
</div>
<nav id="nav" class="cache"><div class="onglets">
  <button data-vue="taches"><span class="ico">✅</span>Mes tâches</button>
  <button data-vue="semaine"><span class="ico">📅</span>Semaine</button>
  <button data-vue="messages"><span class="ico">💬</span>Messages<span class="badge cache" id="badge"></span></button>
  <button data-vue="parents"><span class="ico">🔒</span>Parents</button>
</div></nav>

<script>
/* ===== Accès au serveur (Apps Script) — avec un mode démo pour l'aperçu ===== */
// Page servie par Google : google.script.run. Page servie ailleurs (GitHub Pages) : appel de l'API par fetch.
// L'adresse du serveur n'est PAS écrite dans ce fichier (dépôt public) : elle arrive une fois par le lien
// d'installation (…#api=IDENTIFIANT) puis reste gardée sur la tablette.
// Identifiant lu dans l'adresse (?api=… ou #api=…) à chaque ouverture, sinon dans la mémoire de la tablette
function extraireApi(texte) { var m = String(texte || '').match(/api=([A-Za-z0-9_-]{20,})/) || String(texte || '').match(/\/s\/([A-Za-z0-9_-]{20,})\/exec/); return m ? m[1] : null; }
var API = (function () {
  var id = extraireApi(location.search) || extraireApi(location.hash);
  if (id) { try { localStorage.setItem('api', id); } catch (e) {} return id; }
  try { return localStorage.getItem('api'); } catch (e) { return null; }
})();
function urlApi() { return /^https?:/.test(API) ? API : 'https://script.google.com/macros/s/' + API + '/exec'; }
function srv(nom) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) {
    if (window.google && google.script && google.script.run) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
      r[nom].apply(r, args);
    } else if (API) {
      // text/plain : pas de requête préalable CORS, ce qu'Apps Script accepte
      fetch(urlApi(), { method: 'POST', body: JSON.stringify({ fn: nom, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
        .then(function (r) { return r.json(); })
        .then(function (rep) { if (rep.ok) ok(rep.data); else ko(new Error(rep.erreur || 'Erreur')); })
        .catch(function () { ko(new Error('Pas de connexion. Vérifie le Wi-Fi.')); });
    } else {
      ko(new Error('non-configure'));
    }
  });
}

/* ===== Stockage local (profil choisi sur cette tablette) ===== */
function lireLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function ecrireLocal(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

var S = {
  etat: null,
  profil: lireLocal('profil'),
  vue: 'taches',
  pin: null,              // gardé en mémoire seulement pendant la session
  dernierVu: Number(lireLocal('msgVus') || 0),
  edition: false,
  derniere: Number(lireLocal('activite') || 0)
};

/* ===== Outils ===== */
var JOURS_COURTS = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dateLongue(iso) {
  var p = iso.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)).toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
}
function heure(iso) {
  var d = new Date(iso);
  var auj = new Date();
  var memeJour = d.toDateString() === auj.toDateString();
  return memeJour ? d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' })
                  : d.toLocaleDateString('fr-BE', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
}
function membre(nom) { return (S.etat.membres.filter(function (m) { return m.nom === nom; })[0]) || { nom: nom, couleur: '#888', emoji: '🙂', role: '' }; }
function avatar(nom, m2) {
  var m = m2 || membre(nom);
  var dedans = m.photo ? '<img src="' + esc(m.photo) + '" alt="">' : esc(m.emoji);
  return '<span class="avatar" style="background:' + esc(m.couleur) + '22;border:2px solid ' + esc(m.couleur) + '">' + dedans + '</span>';
}
function pastille(nom) {
  if (!nom) return '<span class="pastille">—</span>';
  var m = membre(nom);
  return '<span class="pastille" style="background:' + esc(m.couleur) + '1f">' + avatar(nom) + esc(nom) + '</span>';
}
function suivi(date, id) { return S.etat.suivi[date + '|' + id] || { fait: false, valide: false, repris: false, personne: '' }; }
// Qui fait réellement la tâche ce jour-là (celle qui l'a reprise, sinon celle de la rotation)
function quiFait(t, date) { var s = suivi(date, t.id); return (s.repris && s.personne) ? s.personne : t.personne; }
function pts(nom) { return Math.max(0, (S.etat.points || {})[nom] || 0); }
function retraitsDe(nom) { return (S.etat.retraits || []).filter(function (r) { return r.personne === nom; }).reverse(); }
function mesRetraits(nom, max) {
  var r = retraitsDe(nom).slice(0, max);
  if (!r.length) return '';
  return '<div style="margin-top:10px"><b style="font-size:.9em">Points retirés</b>' + r.map(function (x) {
    return '<div class="legende"><span class="moins">−' + x.points + '</span> ' + esc(x.motif || 'sans motif') + ' · ' + esc(heure(x.quand)) + '</div>';
  }).join('') + '</div>';
}
function barrePoints(nom) {
  var p = pts(nom), seuil = S.etat.seuil || 10, pct = Math.min(100, Math.round(p / seuil * 100));
  return '<div class="barre' + (p >= seuil ? ' pleine' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="' + seuil + '" aria-valuenow="' + p + '"><span style="width:' + pct + '%"></span></div>';
}
function toast(t) {
  var d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600);
}
function estParent() { return membre(S.profil).role === 'parent'; }
function tachesActives() { return S.etat.taches.filter(function (t) { return t.active; }).sort(function (a, b) { return a.ordre - b.ordre; }); }

/* ===== Expiration de la session après inactivité ===== */
function dureeExpiration() { var e = S.etat ? S.etat.expiration : 60; return (e === undefined || e === null) ? 60 : Number(e); }
function noterActivite() {
  var t = Date.now();
  if (t - S.derniere > 2000) ecrireLocal('activite', String(t));   // gardé pour la réouverture de l'appli
  S.derniere = t;
}
function sessionExpiree() {
  var d = dureeExpiration();
  return d > 0 && Date.now() - S.derniere > d * 1000;
}
function deconnecter(message) {
  S.authParent = null; S.codes = null; S.codesCharges = false; S.voirCodes = false;
  S.profil = null; S.saisieCode = null; S.code = ''; S.retrait = null; S.edition = false; S.pin = null; S.vue = 'taches';
  ecrireLocal('profil', null); rendre(); window.scrollTo(0, 0);
  if (message) toast(message);
}
function verifierExpiration() {
  if (!S.etat) return;
  if ((S.profil || S.saisieCode) && sessionExpiree()) deconnecter(S.profil ? 'Session terminée : choisis ton profil' : '');
}
['click', 'touchstart', 'keydown', 'input', 'scroll'].forEach(function (t) {
  document.addEventListener(t, function () { if (!S.profil || !sessionExpiree()) noterActivite(); }, { passive: true, capture: true });
});
setInterval(verifierExpiration, 5000);

/* ===== Chargement ===== */
function appliquer(etat) {
  var premier = !S.etat;
  S.etat = etat;
  if (premier && S.profil && sessionExpiree()) { S.profil = null; ecrireLocal('profil', null); }   // appli rouverte après un long moment
  rendre();
}
function erreur(e) { toast((e && e.message) ? e.message : 'Oups, réessaie'); }
function charger() {
  return srv('getEtat').then(appliquer).catch(function (e) {
    if (e && e.message === 'non-configure') {
      if (document.getElementById('lienInstall')) return;   // ne pas effacer une saisie en cours
      document.getElementById('app').innerHTML = '<div class="carte" style="margin-top:40px"><h2>Appli pas encore installée sur cet appareil</h2>' +
        '<p>Colle ici le lien d\'installation donné par les parents :</p>' +
        '<form data-form="installer"><div class="champ"><input id="lienInstall" autocomplete="off" placeholder="https://…api=…" aria-label="Lien d\'installation"></div>' +
        '<button class="bouton" type="submit">Installer</button></form></div>';
      return;
    }
    toast('Pas de connexion. Vérifie le Wi-Fi.');
  });
}

/* ===== Rendu ===== */
function rendre() {
  var app = document.getElementById('app');
  if (!S.etat) return;
  var nomsValides = S.etat.membres.map(function (m) { return m.nom; });
  if (!S.profil || nomsValides.indexOf(S.profil) < 0) {
    S.profil = null;
    app.innerHTML = (S.saisieCode && nomsValides.indexOf(S.saisieCode) >= 0) ? vueClavier() : vueProfils();
    cacherBas(true); return;
  }
  cacherBas(false);
  if ((S.vue === 'parents' || S.vue === 'profil' || S.vue === 'taches') && S.edition) return;   // ne pas effacer une saisie en cours
  var html = entete();
  if (S.vue === 'taches') html += vueTaches();
  if (S.vue === 'semaine') html += vueSemaine();
  if (S.vue === 'messages') html += vueMessages();
  if (S.vue === 'parents') html += vueParents();
  if (S.vue === 'profil') html += vueProfil();
  app.innerHTML = html;
  document.getElementById('saisie').classList.toggle('cache', S.vue !== 'messages');
  document.body.classList.toggle('avec-saisie', S.vue === 'messages');
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('actif', b.dataset.vue === S.vue); });
  majBadge();
  if (S.vue === 'messages') {
    if (S.etat.messages.length !== S.nbMsg) window.scrollTo(0, document.body.scrollHeight);
    S.nbMsg = S.etat.messages.length; marquerLus();
  } else S.nbMsg = -1;
}

function cacherBas(c) {
  document.getElementById('nav').classList.toggle('cache', c);
  if (c) document.getElementById('saisie').classList.add('cache');
}

function entete() {
  return '<div class="entete"><div><h1 style="font-size:1.3em;margin:0">Tâches de la maison</h1>' +
    '<div class="date">' + esc(dateLongue(S.etat.aujourdhui)) + '</div></div>' +
    '<div class="droite"><button class="moi" data-action="ouvrirProfil" aria-label="Mon profil">' + avatar(S.profil) + '<b>' + esc(S.profil) + '</b></button>' +
    '<button class="changer" data-action="changerProfil" aria-label="Changer de profil">🔄 Changer</button></div></div>';
}

function vueProfils() {
  return tableauAccueil() + '<h2 style="margin-top:22px">Qui es-tu ?</h2><div class="profils petits">' +
    S.etat.membres.map(function (m) {
      return '<button class="profil" data-action="choisirProfil" data-nom="' + esc(m.nom) + '" style="border-color:' + esc(m.couleur) + '">' +
             avatar(m.nom) + esc(m.nom) + (m.aCode ? ' 🔒' : '') + '</button>';

// Accueil : récapitulatif du jour, visible sans se connecter
function tableauAccueil() {
  var auj = S.etat.aujourdhui, t = tachesActives();
  var nbValide = 0, nbAttente = 0;
  var lignes = t.map(function (x) {
    var s = suivi(auj, x.id), qui = quiFait(x, auj);
    if (s.valide) nbValide++; else if (s.fait) nbAttente++;
    var etat = s.valide ? '<span class="puce valide">⭐<span class="lib"> Validé</span></span>'
      : s.fait ? '<span class="puce attente">⏳<span class="lib"> Fait</span></span>'
      : '<span class="puce afaire">○<span class="lib"> À faire</span></span>';
    var quiHtml = pastille(qui) + (s.repris ? ' 🤝' : '');
    return '<tr class="' + (s.fait ? 'fini' : '') + '"><td class="t-nom">' + esc(x.nom) + '<div class="qui-mobile">' + quiHtml + '</div></td><td class="t-qui">' + quiHtml + '</td><td class="t-etat">' + etat + '</td></tr>';
  });
  var reste = t.length - nbValide - nbAttente;
  return '<div class="accueil-titre"><h1>Aujourd\'hui</h1><span class="date">' + esc(dateLongue(auj)) + '</span></div>' +
    (t.length ? '<div class="resume">' +
      (reste ? '<span style="background:var(--fond);border:2px dashed var(--bord)">○ ' + reste + ' à faire</span>' : '<span style="background:var(--vert-fond);color:var(--vert)">🎉 Tout est fait !</span>') +
      (nbAttente ? '<span style="background:var(--jaune-fond);color:var(--jaune)">⏳ ' + nbAttente + ' à valider</span>' : '') +
      (nbValide ? '<span style="background:var(--vert-fond);color:var(--vert)">⭐ ' + nbValide + ' validée' + (nbValide > 1 ? 's' : '') + '</span>' : '') + '</div>' : '') +
    '<div class="carte" style="padding:6px 14px">' + (t.length ? '<table class="tableau">' + lignes.join('') + '</table>' : '<div class="vide">Aucune tâche aujourd\'hui.</div>') + '</div>';
}

function vueClavier() {
  var n = S.code.length;

    '<div class="points-code" aria-label="' + n + ' chiffres tapés sur 4">' + [0, 1, 2, 3].map(function (i) { return '<span class="' + (i < n ? 'plein' : '') + '"></span>'; }).join('') + '</div>' +
    '<div class="touches">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'annuler', '0', 'efface'].map(function (k) {
      if (k === 'annuler') return '<button data-action="annulerCode" style="font-size:.8em">Retour</button>';
      if (k === 'efface') return '<button data-action="toucheCode" data-k="efface" aria-label="Effacer">⌫</button>';
      return '<button data-action="toucheCode" data-k="' + k + '">' + k + '</button>';

function connecter(nom) { noterActivite(); ecrireLocal('activite', String(S.derniere)); S.profil = nom; S.saisieCode = null; S.code = ''; ecrireLocal('profil', nom); S.vue = 'taches'; rendre(); }

function carteTache(t, date, montrerQui) {
  var s = suivi(date, t.id);
  var qui = quiFait(t, date);
  var repriseParAutre = !montrerQui && s.repris && s.personne && s.personne !== S.profil;
  var repriseParMoi = !montrerQui && s.repris && s.personne === S.profil;
  var action;
  if (montrerQui) {
    // Vue parent : on affiche l'état, sans bouton (c'est à la fille de cocher)
    if (s.valide) action = '<span class="etat valide">⭐ Validé</span>';
    else if (s.fait) action = '<span class="etat attente">⏳ Fait, à valider</span>';
    else action = '<span class="etat afaire">○ Pas encore fait</span>';
  } else if (repriseParAutre) action = '<span class="etat valide">💛 Reprise par ' + esc(s.personne) + '</span>';
  else if (s.valide) action = '<span class="etat valide">⭐ Validé</span>';
  else if (s.fait) action = '<span class="etat attente">⏳ Fait, en attente</span> <button class="bouton leger" data-action="defaire" data-id="' + t.id + '" data-qui="' + esc(qui) + '">Annuler</button>';
  else action = '<button class="bouton vert" data-action="fait" data-id="' + t.id + '" data-qui="' + esc(qui) + '">✓ J\'ai fini</button>' +
    (repriseParMoi ? ' <button class="bouton leger" data-action="rendre" data-id="' + t.id + '">Rendre</button>' : '');
  var sousTitre = '';
  if (montrerQui) sousTitre = '<span class="qui">' + esc(qui || 'personne') + (s.repris ? ' 🤝 (reprise à ' + esc(t.personne) + ')' : '') + '</span>';
  else if (repriseParMoi) sousTitre = '<span class="note-reprise">🤝 Tu la reprends à ' + esc(t.personne) + '</span>';
  else if (t.type === 'tournante') sousTitre = '<div class="prochaine">' + (S.etat.frequence > 1 ? 'À la prochaine rotation' : 'Semaine prochaine') + ' : ' + esc(t.personneSuivante) + '</div>';
  return '<div class="carte"><div class="tache"><div class="nom">' + esc(t.nom) + sousTitre + '</div>' + action + '</div></div>';
}

function vueTaches() {
  var auj = S.etat.aujourdhui;
  if (estParent()) return vueTableauParent();
  var actives = tachesActives();
  var p = pts(S.profil), seuil = S.etat.seuil || 10;
  var html = '<div class="carte"><div class="points"><span class="score">⭐ ' + p + ' / ' + seuil + '</span>' + barrePoints(S.profil) + '</div>' +
    (p >= seuil ? '<div class="gagne">🎁 Tu as gagné une récompense ! Va voir papa ou maman.</div>'
                : '<div class="legende">Encore ' + (seuil - p) + ' point' + (seuil - p > 1 ? 's' : '') + ' avant ta récompense. 1 tâche validée = 1 point.</div>') +
    mesRetraits(S.profil, 3) + '</div>';

  var miennes = actives.filter(function (t) { return t.personne === S.profil; });
  var reprises = actives.filter(function (t) { var s = suivi(auj, t.id); return t.personne !== S.profil && s.repris && s.personne === S.profil; });
  html += '<h2>Mes tâches de la semaine</h2>';
  if (!miennes.length && !reprises.length) html += '<div class="carte vide">🎉 Pas de tâche pour toi cette semaine !</div>';
  html += miennes.map(function (t) { return carteTache(t, auj, false); }).join('');
  html += reprises.map(function (t) { return carteTache(t, auj, false); }).join('');
  var aFaire = miennes.filter(function (t) { return quiFait(t, auj) === S.profil; }).concat(reprises);
  if (aFaire.length && aFaire.every(function (t) { return suivi(auj, t.id).fait; })) html += '<div class="carte vide" style="color:var(--vert);font-weight:600">Bravo, tout est fait pour aujourd\'hui ! 👏</div>';

  // Tâches des autres qu'on peut reprendre aujourd'hui
  var aider = actives.filter(function (t) {
    var s = suivi(auj, t.id);
    return t.personne && t.personne !== S.profil && !s.fait && !s.repris;
  });
  if (aider.length) {
    html += '<h2>Reprendre une tâche</h2><p class="legende" style="margin-top:-6px">Une sœur est absente ou débordée ? Reprends sa tâche d\'aujourd\'hui : si elle est validée, le point est pour toi.</p>' +
      aider.map(function (t) {
        return '<div class="carte"><div class="tache"><div class="nom">' + esc(t.nom) + '<span class="qui">' + esc(t.personne) + '</span></div>' +
          '<button class="bouton leger" data-action="reprendre" data-id="' + t.id + '" data-de="' + esc(t.personne) + '">🤝 Je la reprends</button></div></div>';
      }).join('');
  }
  return html;
}

      (S.retrait === f.nom ? '<form class="retrait-form" data-form="retrait" data-retrait="1">' +

/* Réduit la photo à 160 × 160 px pour qu'elle reste légère */
function preparerPhoto(fichier) {
  return new Promise(function (ok, ko) {
    var lecteur = new FileReader();
    lecteur.onerror = ko;
    lecteur.onload = function () {
      var img = new Image();
      img.onerror = function () { ko(new Error('Image illisible')); };
      img.onload = function () {
        var c = document.createElement('canvas'), t = 160; c.width = t; c.height = t;
        var cote = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - cote) / 2, (img.height - cote) / 2, cote, cote, 0, 0, t, t);
        ok(c.toDataURL('image/jpeg', 0.75));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

function vueMessages() {
  var m = S.etat.messages;
  if (!m.length) return '<h2>Messages</h2><div class="carte vide">Pas encore de message. Écris le premier !</div>';
  return '<h2>Messages</h2><div class="fil">' + m.map(function (x) {
    var mb = membre(x.auteur);
    return '<div class="bulle' + (x.auteur === S.profil ? ' de-moi' : '') + '" style="border-color:' + esc(mb.couleur) + ';background:' + esc(mb.couleur) + '14">' +
      '<div class="auteur" style="color:' + esc(mb.couleur) + '">' + esc(mb.emoji) + ' ' + esc(x.auteur) + ' <span class="heure">' + esc(heure(x.quand)) + '</span></div>' +
      '<div class="texte">' + esc(x.texte) + '</div></div>';
  }).join('') + '</div>';
}

function vueParents() {
  if (!S.pin) {
    return '<h2>Espace parents</h2><div class="carte"><form data-form="pin"><div class="champ"><label for="pin">Code parents</label>' +
      '<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>' +
      '<button class="bouton" type="submit">Entrer</button></form>' +
      '<p class="legende">Ici : gestion de l\'appli (tâches, rotation, réglages). La validation et les points sont sur la page de chaque parent.</p></div>';
  }
  if (!S.codesCharges) {
    S.codesCharges = true;
    srv('codesDesFilles', S.pin).then(function (c) { S.codes = c; if (S.vue === 'parents' && !S.edition) rendre(); }).catch(function () { S.codesCharges = false; });
  }
  var filles = S.etat.membres.filter(function (m) { return m.role === 'fille'; });
  var html = '<div class="entete"><h2 style="margin:0">Espace parents</h2><button class="bouton leger" data-action="sortir">Fermer 🔒</button></div>';
  var toutesTaches = S.etat.taches.slice().sort(function (a, b) { return a.ordre - b.ordre; });
  html += '<div class="carte"><h3>Les tâches</h3>' + toutesTaches.map(function (x, i) {
    return '<div class="ligne-admin" data-ligne="' + x.id + '">' +
      '<input data-champ="nom" value="' + esc(x.nom) + '" aria-label="Nom de la tâche">' +
      '<select data-champ="type" aria-label="Type"><option value="tournante"' + (x.type === 'tournante' ? ' selected' : '') + '>🔄 Tournante</option>' +
      '<option value="fixe"' + (x.type === 'fixe' ? ' selected' : '') + '>📌 Fixe</option></select>' +
      '<select data-champ="assignee" aria-label="Pour qui"' + (x.type === 'fixe' ? '' : ' disabled') + '><option value="">Pour qui ?</option>' +
      filles.map(function (f) { return '<option' + (x.assignee === f.nom ? ' selected' : '') + '>' + esc(f.nom) + '</option>'; }).join('') + '</select>' +
      '<div class="actions"><label class="case"><input type="checkbox" data-champ="active"' + (x.active ? ' checked' : '') + '> Active</label>' +
      '<button class="bouton" data-action="enregistrer" data-id="' + x.id + '">Enregistrer</button>' +
      '<button class="bouton leger" data-action="monter" data-id="' + x.id + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Monter">▲</button>' +
      '<button class="bouton leger" data-action="descendre" data-id="' + x.id + '"' + (i === toutesTaches.length - 1 ? ' disabled' : '') + ' aria-label="Descendre">▼</button>' +
      '<button class="bouton danger" data-action="supprimer" data-id="' + x.id + '">Supprimer</button></div></div>';
  }).join('') +
    '<h3 style="margin-top:18px">Ajouter une tâche</h3><div class="ligne-admin" data-ligne="nouvelle">' +
    '<input data-champ="nom" placeholder="Ex. : Sortir les poubelles" aria-label="Nom de la nouvelle tâche">' +
    '<select data-champ="type" aria-label="Type"><option value="tournante">🔄 Tournante</option><option value="fixe">📌 Fixe</option></select>' +
    '<select data-champ="assignee" disabled aria-label="Pour qui"><option value="">Pour qui ?</option>' + filles.map(function (f) { return '<option>' + esc(f.nom) + '</option>'; }).join('') + '</select>' +
    '<div class="actions"><button class="bouton vert" data-action="ajouter">+ Ajouter</button></div></div>' +
    '<p class="legende">🔄 Tournante : change de personne à chaque rotation. 📌 Fixe : toujours la même personne.</p></div>';

  html += '<div class="carte"><h3>Rotation</h3><div class="champ"><label for="freq">Les tâches tournent toutes les…</label>' +
    '<select id="freq">' + [1, 2, 3, 4].map(function (n) { return '<option value="' + n + '"' + (S.etat.frequence === n ? ' selected' : '') + '>' + n + ' semaine' + (n > 1 ? 's' : '') + '</option>'; }).join('') + '</select></div>' +
    '<div class="actions"><button class="bouton leger" data-action="decaler" data-sens="-1">◀ Revenir d\'un cran</button>' +
    '<button class="bouton leger" data-action="decaler" data-sens="1">Avancer d\'un cran ▶</button></div>' +
    '<p class="legende">« Avancer d\'un cran » fait tourner tout de suite les tâches, par exemple si quelqu\'un était absente.</p></div>';

  html += '<div class="carte"><h3>Réglages</h3><div class="champ"><label for="seuil">Points pour une récompense</label>' +
    '<select id="seuil">' + [5, 10, 15, 20, 25, 30].concat([S.etat.seuil || 10]).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(function (a, b) { return a - b; })
      .map(function (n) { return '<option value="' + n + '"' + (n === (S.etat.seuil || 10) ? ' selected' : '') + '>' + n + ' points</option>'; }).join('') + '</select></div>' +
    '<div class="champ"><span>Codes secrets des filles</span>' +
      S.etat.membres.filter(function (m) { return m.role === 'fille'; }).map(function (m) {
        var c = S.codes ? S.codes[m.nom] : null;
        var aff = !S.codes ? '…' : (!c ? '<span class="legende" style="margin:0">pas de code</span>'
          : '<b style="letter-spacing:.3em;font-size:1.15em">' + (S.voirCodes ? esc(c) : '••••') + '</b>');
        return '<div class="ligne-qui" style="padding:4px 0">' + pastille(m.nom) + '<span class="actions" style="align-items:center">' + aff +
          (c ? ' <button class="bouton leger" data-action="effacerCode" data-nom="' + esc(m.nom) + '">Effacer</button>' : '') + '</span></div>';
      }).join('') +
      (S.codes && Object.keys(S.codes).some(function (k) { return S.codes[k]; }) ?
        '<div><button class="bouton leger" data-action="voirCodes">' + (S.voirCodes ? '🙈 Masquer les codes' : '👁 Voir les codes') + '</button></div>' : '') +
    '</div>' +
    '<div class="champ"><label for="expiration">Déconnexion automatique après</label><select id="expiration">' +
      [[60, '1 minute sans rien toucher'], [120, '2 minutes'], [300, '5 minutes'], [900, '15 minutes'], [0, 'Jamais']].map(function (o) {
        return '<option value="' + o[0] + '"' + (dureeExpiration() === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    '<form data-form="nouveauPin"><div class="champ"><label for="nouveauPin">Nouveau code parents (4 à 8 chiffres)</label>' +
    '<input id="nouveauPin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></div>' +
    '<button class="bouton" type="submit">Changer le code</button></form>' +
    '<div style="margin-top:16px"><button class="bouton danger" data-action="effacerMessages">Effacer tous les messages</button></div></div>';
  return html;
}

/* ===== Messages non lus ===== */
function dernierMessageMs() { var m = S.etat.messages; return m.length ? new Date(m[m.length - 1].quand).getTime() : 0; }
function majBadge() {
  var n = S.etat.messages.filter(function (x) { return new Date(x.quand).getTime() > S.dernierVu && x.auteur !== S.profil; }).length;
  var b = document.getElementById('badge');
  b.textContent = n; b.classList.toggle('cache', !n || S.vue === 'messages');
}
function marquerLus() { S.dernierVu = dernierMessageMs(); ecrireLocal('msgVus', String(S.dernierVu)); majBadge(); }

/* ===== Interactions ===== */
function lireLigne(id) {
  var l = document.querySelector('[data-ligne="' + id + '"]');
  var g = function (c) { return l.querySelector('[data-champ="' + c + '"]'); };
  return { id: id, nom: g('nom').value, type: g('type').value, assignee: g('assignee').value, active: g('active') ? g('active').checked : true };
}
function occupe(btn, p) {
  if (btn) btn.disabled = true;
  return p.then(function (e) { S.edition = false; appliquer(e); return true; })
          .catch(function (e) { if (btn) btn.disabled = false; erreur(e); return false; });
}
function siOk(msg) { return function (ok) { if (ok) toast(msg); }; }

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-vue], [data-action]');
  if (!b) return;
  if (b.dataset.vue) { S.codes = null; S.codesCharges = false; S.voirCodes = false; S.vue = b.dataset.vue; S.edition = false; rendre(); window.scrollTo(0, S.vue === 'messages' ? document.body.scrollHeight : 0); return; }
  var a = b.dataset.action, id = b.dataset.id;
  if (a === 'choisirProfil') {
    if (membre(b.dataset.nom).aCode) { S.saisieCode = b.dataset.nom; S.code = ''; S.secoue = false; rendre(); return; }
    // Vérifie quand même auprès du serveur (un code a pu être créé sur une autre tablette)
    var nomChoisi = b.dataset.nom;
    srv('entrerProfil', nomChoisi, '').then(function () { connecter(nomChoisi); })
      .catch(function () { S.saisieCode = nomChoisi; S.code = ''; S.secoue = false; rendre(); charger(); });
    return;
  }
  if (a === 'annulerCode') { S.saisieCode = null; S.code = ''; rendre(); return; }
  if (a === 'toucheCode') {
    S.secoue = false;
    if (b.dataset.k === 'efface') S.code = S.code.slice(0, -1);
    else if (S.code.length < 4) S.code += b.dataset.k;
    rendre();
    if (S.code.length === 4) {
      var qui = S.saisieCode, essai = S.code;
      srv('entrerProfil', qui, essai).then(function () { if (membre(qui).role === 'parent') S.authParent = { nom: qui, code: essai }; connecter(qui); })
        .catch(function (e) { S.code = ''; S.secoue = true; rendre(); toast((e && e.message) || 'Code incorrect'); });
    }
    return;
  }
  if (a === 'retirerCode') {
    var anc = document.getElementById('ancienCode');
    if (!anc || !anc.value) { toast('Tape d\'abord ton code actuel'); return; }
    return occupe(b, srv('changerCodeProfil', S.profil, anc.value, '')).then(function (ok) { if (ok) { if (S.authParent && S.authParent.nom === S.profil) S.authParent = null; toast('Code retiré'); } });
  }
  if (a === 'effacerCode') { if (confirm('Effacer le code de ' + b.dataset.nom + ' ?')) { S.codesCharges = false; S.codes = null; return occupe(b, srv('effacerCodeProfil', S.pin, b.dataset.nom)).then(siOk('Code effacé')); } return; }
  if (a === 'voirCodes') { S.voirCodes = !S.voirCodes; rendre(); return; }
  if (a === 'ouvrirProfil') { var mm = membre(S.profil); S.brouillon = { emoji: mm.emoji, couleur: mm.couleur, photo: mm.photo || '' }; S.vue = 'profil'; rendre(); window.scrollTo(0, 0); return; }
  if (a === 'emoji') { S.brouillon.emoji = b.dataset.e; S.brouillon.photo = ''; rendre(); return; }
  if (a === 'couleur') { S.brouillon.couleur = b.dataset.c; rendre(); return; }
  if (a === 'retirerPhoto') { S.brouillon.photo = ''; rendre(); return; }
  if (a === 'annulerProfil') { S.vue = 'taches'; rendre(); return; }
  if (a === 'sauverProfil') return occupe(b, srv('modifierProfil', S.profil, S.brouillon)).then(function (ok) { if (ok) { toast('Profil enregistré'); S.vue = 'taches'; rendre(); } });
  if (a === 'changerProfil') { deconnecter(''); return; }
  if (a === 'fait') return occupe(b, srv('marquerFait', S.etat.aujourdhui, id, b.dataset.qui || S.profil, true)).then(siOk('Super ! 👏'));
  if (a === 'defaire') return occupe(b, srv('marquerFait', S.etat.aujourdhui, id, b.dataset.qui || S.profil, false));
  if (a === 'reprendre') { if (confirm('Reprendre « ' + b.closest('.tache').querySelector('.nom').firstChild.textContent + ' » à la place de ' + b.dataset.de + ' ?')) return occupe(b, srv('reprendreTache', id, S.profil)).then(siOk('C\'est gentil ! 💛')); return; }
  if (a === 'rendre') return occupe(b, srv('rendreTache', id, S.profil));
  if (a === 'ouvrirRetrait') { S.retrait = b.dataset.nom; S.edition = false; rendre(); var m = document.getElementById('motifRetrait'); if (m) m.focus(); return; }
  if (a === 'fermerRetrait') { S.retrait = null; S.edition = false; rendre(); return; }
  if (a === 'annulerRetrait') return occupe(b, srv('annulerRetrait', autorite(), b.dataset.quand, b.dataset.nom)).then(siOk('Retrait annulé'));
  if (a === 'recompense') { if (confirm('Récompense donnée à ' + b.dataset.nom + ' ?')) return occupe(b, srv('donnerRecompense', autorite(), b.dataset.nom)).then(siOk('Bravo ' + b.dataset.nom + ' ! 🎁')); return; }
  if (a === 'sortir') { S.pin = null; S.codes = null; S.codesCharges = false; S.voirCodes = false; S.edition = false; rendre(); return; }
  if (a === 'valider') return occupe(b, srv('valider', autorite(), b.dataset.date, id, b.dataset.qui || '', true));
  if (a === 'devalider') return occupe(b, srv('valider', autorite(), b.dataset.date, id, '', false));
  if (a === 'toutValider') {
    var boutons = Array.prototype.slice.call(document.querySelectorAll('[data-av]'));
    b.disabled = true;
    return boutons.reduce(function (p, x) { return p.then(function () { return srv('valider', autorite(), x.dataset.date, x.dataset.id, x.dataset.qui, true); }); }, Promise.resolve())
      .then(appliquer).catch(erreur);
  }
  if (a === 'enregistrer') return occupe(b, srv('enregistrerTache', S.pin, lireLigne(id))).then(siOk('Enregistré'));
  if (a === 'ajouter') {
    var n = lireLigne('nouvelle'); n.id = '';
    if (!n.nom.trim()) { toast('Donne un nom à la tâche'); return; }
    if (n.type === 'fixe' && !n.assignee) { toast('Choisis pour qui'); return; }
    return occupe(b, srv('enregistrerTache', S.pin, n)).then(siOk('Tâche ajoutée'));
  }
  if (a === 'monter' || a === 'descendre') return occupe(b, srv('deplacerTache', S.pin, id, a === 'monter' ? -1 : 1));
  if (a === 'supprimer') { if (confirm('Supprimer cette tâche ?')) return occupe(b, srv('supprimerTache', S.pin, id)); return; }
  if (a === 'decaler') return occupe(b, srv('decalerRotation', S.pin, Number(b.dataset.sens))).then(siOk('Rotation déplacée'));
  if (a === 'effacerMessages') { if (confirm('Effacer tous les messages ?')) return occupe(b, srv('effacerMessages', S.pin)); return; }
});

document.addEventListener('input', function (ev) {
  if ((S.vue === 'parents' || S.vue === 'taches') && ev.target.closest('.ligne-admin, [data-retrait]')) S.edition = true;
  if (S.vue === 'profil' && ev.target.closest('[data-code-form]')) S.edition = true;
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'fichierPhoto' && t.files && t.files[0]) {
    preparerPhoto(t.files[0]).then(function (url) { S.brouillon.photo = url; rendre(); }).catch(function () { toast('Cette image ne marche pas'); });
    return;
  }
  if (t.dataset && t.dataset.champ === 'type') {
    var sel = t.closest('.ligne-admin').querySelector('[data-champ="assignee"]');
    sel.disabled = t.value !== 'fixe';
  }
  if (t.id === 'expiration') { occupe(null, srv('changerExpiration', S.pin, Number(t.value))).then(siOk('Réglage enregistré')); return; }
  if (t.id === 'seuil') { occupe(null, srv('changerSeuil', S.pin, Number(t.value))).then(siOk('Seuil mis à jour')); return; }
  if (t.id === 'freq') occupe(null, srv('changerFrequence', S.pin, Number(t.value))).then(siOk('Rotation mise à jour'));
});

document.addEventListener('submit', function (ev) {
  var f = ev.target;
  ev.preventDefault();
  if (f.id === 'formMessage') {
    var champ = document.getElementById('champMessage');
    var texte = champ.value.trim();
    if (!texte) return;
    champ.value = '';
    srv('envoyerMessage', S.profil, texte).then(appliquer).catch(function (e) { champ.value = texte; erreur(e); });
  }
  if (f.dataset.form === 'retrait') {
    var nom = S.retrait, n = Number(document.getElementById('nbRetrait').value), motif = document.getElementById('motifRetrait').value;
    var btn = f.querySelector('button[type=submit]');
    occupe(btn, srv('retirerPoints', autorite(), nom, n, motif)).then(function (ok) { if (ok) { S.retrait = null; rendre(); toast(n + ' point' + (n > 1 ? 's' : '') + ' retiré' + (n > 1 ? 's' : '') + ' à ' + nom); } });
  }
  if (f.dataset.form === 'codeProfil') {
    var nv = document.getElementById('nouveauCode').value, an = document.getElementById('ancienCode');
    if (!/^\d{4}$/.test(nv)) { toast('Le code doit avoir 4 chiffres'); return; }
    occupe(f.querySelector('button[type=submit]'), srv('changerCodeProfil', S.profil, an ? an.value : '', nv)).then(function (ok) {
      if (!ok) return;
      if (membre(S.profil).role === 'parent') S.authParent = { nom: S.profil, code: nv };
      toast('Code enregistré 🔒');
    });
  }
  if (f.dataset.form === 'installer') {
    var id = extraireApi(document.getElementById('lienInstall').value);
    if (!id) { toast('Lien incomplet : il doit contenir api=…'); return; }
    API = id; try { localStorage.setItem('api', id); } catch (e2) {}
    charger();
  }
  if (f.dataset.form === 'pin') {
    var pin = document.getElementById('pin').value;
    srv('connexionParents', pin).then(function () { S.pin = pin; rendre(); }).catch(function () { toast('Code incorrect'); });
  }
  if (f.dataset.form === 'nouveauPin') {
    var np = document.getElementById('nouveauPin').value;
    srv('changerPin', S.pin, np).then(function () { S.pin = np; toast('Code changé'); document.getElementById('nouveauPin').value = ''; }).catch(erreur);
  }
});


/* Mise à jour en direct : toutes les 10 secondes quand l'écran est visible */
setInterval(function () { if (!document.hidden) charger(); }, 10000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) { verifierExpiration(); charger(); } });
charger();
</script>
