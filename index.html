<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #FBF7EE;
    --carte: #FFFFFF;
    --texte: #24262B;
    --doux: #5E6470;
    --bord: #E4DDCD;
    --accent: #2F6F8F;
    --vert: #2E8B57;
    --vert-fond: #E3F3E9;
    --jaune: #B7791F;
    --jaune-fond: #FDF3DC;
    --rouge: #B83A3A;
    --ombre: 0 2px 8px rgba(40, 35, 20, .08);
    --alt: #F1EADB;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #1E2024; --carte: #2A2D33; --texte: #EEEAE2; --doux: #B5B0A6; --bord: #3B3F47;
      --accent: #7DB8D6; --vert: #6CC891; --vert-fond: #24382C; --jaune: #E3B25B; --jaune-fond: #3A3222;
      --rouge: #E07B7B; --ombre: none; --alt: #33363D;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); }
  body {
    font-family: 'Lexend', 'Verdana', sans-serif;   /* zéros non barrés */
    font-size: 20px; line-height: 1.6; letter-spacing: .02em; word-spacing: .08em;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; letter-spacing: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3 { line-height: 1.3; margin: 0 0 .5em; }
  h2 { font-size: 1.25em; }
  h3 { font-size: 1.05em; }

  .app { max-width: 900px; margin: 0 auto; padding: 16px 16px 110px; }
  .entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .entete .date { color: var(--doux); font-size: .9em; }
  .moi { display: flex; align-items: center; gap: 10px; background: var(--carte); border: 2px solid var(--bord);
         border-radius: 999px; padding: 6px 16px 6px 8px; min-height: 52px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; flex: none; }

  .carte { background: var(--carte); border: 2px solid var(--bord); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--ombre); }
  .vide { color: var(--doux); text-align: center; padding: 24px 8px; }

  /* Choix du profil */
  .profils { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .profil { background: var(--carte); border: 3px solid var(--bord); border-radius: 20px; padding: 18px 10px;
            display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 600; font-size: 1.05em; }
  .profil .avatar { width: 76px; height: 76px; font-size: 44px; }

  /* Tâche */
  .tache { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .tache .nom { font-weight: 700; font-size: 1.1em; flex: 1 1 220px; }
  .tache .qui { color: var(--doux); font-size: .9em; font-weight: 400; display: block; }
  .bouton { border: none; border-radius: 14px; padding: 12px 20px; min-height: 56px; font-weight: 600;
            background: var(--accent); color: #fff; }
  .bouton.vert { background: var(--vert); }
  .bouton.leger { background: transparent; color: var(--texte); border: 2px solid var(--bord); }
  .bouton.danger { background: transparent; color: var(--rouge); border: 2px solid var(--rouge); }
  .bouton:disabled { opacity: .5; }
  .etat { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; padding: 10px 16px; font-weight: 600; min-height: 56px; }
  .etat.attente { background: var(--jaune-fond); color: var(--jaune); }
  .etat.valide { background: var(--vert-fond); color: var(--vert); }
  .etat.afaire { background: var(--fond); color: var(--doux); border: 2px dashed var(--bord); }
  .prochaine { color: var(--doux); font-size: .9em; margin-top: 4px; }

  /* Semaine */
  .grille-wrap { overflow-x: auto; }
  table.grille { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 560px; }
  .grille th { font-weight: 600; font-size: .8em; color: var(--doux); text-align: center; padding: 4px; }
  .grille th.jour-actuel { color: var(--accent); }
  .grille td { text-align: center; font-size: 1.2em; padding: 6px 2px; border-radius: 10px; background: var(--fond); }
  .grille td.tache-nom { text-align: left; font-size: .85em; font-weight: 600; background: none; padding-left: 0; }
  .grille td.jour-actuel { outline: 2px solid var(--accent); }
  .pastille { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px 2px 4px; font-size: .9em; font-weight: 600; }
  .pastille .avatar { width: 28px; height: 28px; font-size: 16px; }
  .legende { color: var(--doux); font-size: .85em; margin-top: 8px; }
  .liste-qui { display: grid; gap: 10px; }
  .ligne-qui { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Messages */
  .fil { display: flex; flex-direction: column; gap: 10px; }
  .bulle { max-width: 82%; padding: 10px 14px; border-radius: 16px; background: var(--carte); border: 2px solid var(--bord); }
  .bulle.de-moi { align-self: flex-end; }
  .bulle .auteur { font-weight: 700; font-size: .85em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .bulle .auteur .avatar { width: 30px; height: 30px; font-size: 17px; }
  .bulle .heure { color: var(--doux); font-size: .75em; }
  .bulle .texte { white-space: pre-wrap; word-wrap: break-word; }
  .saisie { position: fixed; left: 0; right: 0; bottom: 84px; background: var(--fond); padding: 10px 16px; border-top: 2px solid var(--bord); }
  .saisie form { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
  .saisie input { flex: 1; min-height: 56px; border-radius: 14px; border: 2px solid var(--bord); padding: 0 14px; background: var(--carte); }

  /* Parents */
  .champ { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .champ input, .champ select, .ligne-admin input, .ligne-admin select {
    min-height: 52px; border-radius: 12px; border: 2px solid var(--bord); padding: 0 12px; background: var(--carte); }
  .ligne-admin { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 12px 0; border-bottom: 2px solid var(--bord); }
  .ligne-admin:last-child { border-bottom: none; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .bouton { min-height: 48px; padding: 8px 14px; }
  .case { display: inline-flex; align-items: center; gap: 8px; }
  .case input { width: 26px; height: 26px; }
  @media (min-width: 700px) {
    .ligne-admin { grid-template-columns: 1fr 170px 170px; align-items: center; }
    .ligne-admin .actions { grid-column: 1 / -1; }
  }

  /* Navigation */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--carte); border-top: 2px solid var(--bord); }
  nav .onglets { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav button { background: none; border: none; padding: 8px 4px 12px; min-height: 84px; display: flex; flex-direction: column;
               align-items: center; gap: 2px; font-size: .78em; font-weight: 600; color: var(--doux); position: relative; }
  nav button .ico { font-size: 1.8em; line-height: 1.2; }
  nav button.actif { color: var(--accent); }
  nav button.actif::before { content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 4px; border-radius: 0 0 4px 4px; background: var(--accent); }
  .badge { position: absolute; top: 8px; right: 22%; background: var(--rouge); color: #fff; border-radius: 999px; font-size: .75em; min-width: 22px; padding: 0 6px; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--texte); color: var(--fond);
           padding: 12px 20px; border-radius: 14px; font-weight: 600; z-index: 10; max-width: 90%; text-align: center; }
  body.avec-saisie .app { padding-bottom: 200px; }
  body.avec-saisie .toast { bottom: 180px; }
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .apercu { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 8px; }
  .apercu .avatar { width: 128px; height: 128px; font-size: 72px; border-width: 4px !important; }
  .choix-emoji { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
  .choix-emoji button { min-height: 60px; font-size: 32px; border-radius: 14px; border: 3px solid var(--bord); background: var(--carte); }
  .choix-emoji button.choisi, .couleurs button.choisi { border-color: var(--texte); }
  .couleurs { display: flex; flex-wrap: wrap; gap: 10px; }
  .couleurs button { width: 52px; height: 52px; border-radius: 50%; border: 4px solid transparent; }
  .points { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .points .score { font-size: 1.5em; font-weight: 700; }
  .barre { flex: 1 1 200px; height: 22px; border-radius: 999px; background: var(--fond); border: 2px solid var(--bord); overflow: hidden; }
  .barre span { display: block; height: 100%; background: var(--jaune); border-radius: 999px; }
  .barre.pleine span { background: var(--vert); }
  .gagne { background: var(--vert-fond); color: var(--vert); font-weight: 700; border-radius: 14px; padding: 12px 16px; margin-top: 12px; }
  .note-reprise { color: var(--doux); font-size: .9em; font-weight: 400; display: block; }
  .retrait-form { display: grid; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 14px; background: var(--fond); border: 2px solid var(--bord); }
  .retrait-form input, .retrait-form select { min-height: 52px; border-radius: 12px; border: 2px solid var(--bord); padding: 0 12px; background: var(--carte); }
  .moins { color: var(--rouge); font-weight: 700; }
  .plus { color: var(--vert); font-weight: 700; }
  .bouton-recap { min-height: 44px; padding: 4px 14px; font-size: .85em; }
  .titre-profils { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; margin-bottom: .5em; }
  .titre-profils h2 { margin: 0; }
  .tableau-recap th { text-align: left; font-size: .8em; color: var(--doux); font-weight: 600; padding: 4px 8px; }
  .tableau-recap tr.cliquable { cursor: pointer; }
  .tableau-recap tr.cliquable:active td { background: var(--fond); }
  .resume-recap { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0 10px; font-size: 1.05em; }
  .ligne-recap { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-bottom: 2px solid var(--bord); }
  .ligne-recap:last-child { border-bottom: none; }
  .ligne-recap .ico { font-size: 1.3em; }
  .ligne-recap .txt { flex: 1; font-weight: 600; }
  .bonus-form { border-color: var(--vert); }
  .clavier { max-width: 360px; margin: 0 auto; text-align: center; }
  .clavier .avatar { width: 96px; height: 96px; font-size: 54px; margin: 0 auto 8px; }
  .points-code { display: flex; justify-content: center; gap: 16px; margin: 18px 0; }
  .points-code span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--texte); }
  .points-code span.plein { background: var(--texte); }
  .touches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .touches button { min-height: 72px; font-size: 1.6em; font-weight: 700; border-radius: 18px; border: 2px solid var(--bord); background: var(--carte); }
  .secoue { animation: secoue .35s; }
  @keyframes secoue { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .changer { display: flex; align-items: center; gap: 6px; background: var(--carte); border: 2px solid var(--bord); border-radius: 999px;
             padding: 6px 14px; min-height: 52px; font-weight: 600; font-size: .85em; }
  .entete .droite { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  /* Accueil : tableau du jour */
  .accueil-titre { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .accueil-titre h1 { font-size: 1.4em; margin: 0; }
  .phrase-jour { margin-top: 14px; padding: 10px 16px; border-radius: 16px; background: var(--carte); border: 2px dashed var(--bord);
    color: var(--accent); font-weight: 600; text-align: center; }
  @media (min-width: 1000px) and (max-height: 700px) { .phrase-jour { margin-top: 8px; padding: 6px 12px; font-size: .9em; } }
  .oeuf-barre { position: relative; display: inline-block; opacity: .6; }
  .oeuf-barre::after { content: ''; position: absolute; left: -3px; right: -3px; top: 50%; border-top: 3px solid var(--rouge); transform: rotate(-35deg); }
  body.sans-nav .app { padding-bottom: 16px; }
  .veille-phrase { margin-top: 14px; font-size: 1.15em; color: #CFC9BD; max-width: 80vw; }
  .resume { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .resume span { border-radius: 999px; padding: 4px 14px; font-weight: 600; font-size: .9em; }
  .tableau { width: 100%; border-collapse: collapse; }
  .tableau td { padding: 12px 8px; border-bottom: 2px solid var(--bord); vertical-align: middle; }
  .tableau tr:last-child td { border-bottom: none; }
  .tableau .t-nom { font-weight: 700; font-size: 1.05em; }
  .tableau .t-etat { text-align: right; white-space: nowrap; }
  .tableau tr.fini .t-nom { color: var(--doux); text-decoration: line-through; text-decoration-thickness: 2px; }
  .puce { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 6px 12px; font-weight: 600; font-size: .9em; }
  .puce.afaire { border: 2px dashed var(--bord); color: var(--doux); }
  .puce.attente { background: var(--jaune-fond); color: var(--jaune); }
  .puce.valide { background: var(--vert-fond); color: var(--vert); }
  .profils.petits { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .profils.petits .profil { padding: 10px 6px; font-size: .95em; gap: 4px; }
  .profils.petits .profil .avatar { width: 56px; height: 56px; font-size: 32px; }
  .tableau .qui-mobile { display: none; }
  @media (max-width: 560px) {
    .tableau .t-etat .lib { display: none; }   /* sur petit écran : l'icône seule */
    .tableau td.t-qui { display: none; }        /* le prénom passe sous la tâche */
    .tableau .qui-mobile { display: block; margin-top: 6px; font-weight: 400; }
    .tableau td { padding: 10px 4px; }
  }
  /* Colonne de droite (tablette en paysage) : heure, météo, radio */
  .cote { display: none; }
  @media (min-width: 1000px) {
    .cote { display: flex; flex-direction: column; gap: 14px; position: fixed; top: 0; right: 0; bottom: 0; width: 33.333vw;
            padding: 16px; overflow-y: auto; background: var(--carte); border-left: 2px solid var(--bord); }
    .app { max-width: none; width: 66.666vw; margin: 0; padding-left: 24px; padding-right: 24px; }
    nav, .saisie { right: 33.333vw; }
    .toast { left: 33.333vw; }
  }
  .bloc { background: var(--fond); border: 2px solid var(--bord); border-radius: 18px; padding: 14px 16px; }
  .bloc h3 { margin: 0 0 8px; font-size: .9em; color: var(--doux); text-transform: uppercase; letter-spacing: .08em; }
  .horloge { font-size: 3.4em; font-weight: 700; line-height: 1; letter-spacing: .02em; }
  .horloge-date { color: var(--doux); margin-top: 6px; }
  .meteo-maint { display: flex; align-items: center; gap: 12px; }
  .meteo-ico { font-size: 2.6em; line-height: 1; }
  .meteo-temp { font-size: 2.2em; font-weight: 700; line-height: 1; }
  .lune { margin-left: auto; flex: none; text-align: center; font-size: .68em; line-height: 1.2; color: var(--doux); max-width: 6.5em; }
  .meteo-maint > div:not(.lune) { min-width: 0; }
  .meteo-maint .legende { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lune .ico-lune { display: block; font-size: 2.4em; line-height: 1.1; }
  .meteo-jours { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; text-align: center; font-size: .85em; }
  .meteo-jours div { background: var(--carte); border-radius: 12px; padding: 6px 2px; }
  .meteo-jours .ico { font-size: 1.6em; display: block; }
  .radios { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .radios button { min-height: 56px; border-radius: 14px; border: 2px solid var(--bord); background: var(--carte); font-weight: 600; font-size: .85em; padding: 6px; }
  .radios button.joue { background: var(--accent); color: #fff; border-color: var(--accent); }
  .radio-etat { margin-top: 8px; font-size: .85em; color: var(--doux); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  /* Paramètres : liste des tâches, une carte par tâche */
  .liste-taches { display: grid; gap: 12px; }
  .liste-taches .ligne-admin { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center;
    padding: 14px; border: 2px solid var(--bord); border-left: 10px solid var(--accent); border-radius: 16px; background: var(--carte); }
  .liste-taches .ligne-admin:nth-child(even) { background: var(--alt); }
  .liste-taches .ligne-admin.fixe { border-left-color: var(--jaune); }
  .liste-taches .ligne-admin.inactive { opacity: .6; border-left-color: var(--doux); }
  .ligne-admin .num { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    background: var(--accent); color: #fff; }
  .ligne-admin.fixe .num { background: var(--jaune); }
  .ligne-admin .reglages { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .liste-taches .ligne-admin .actions { grid-column: 1 / -1; align-items: center; padding-top: 8px; border-top: 2px dashed var(--bord); }
  .ligne-admin .actions .pousse { margin-left: auto; }
  .ajout-tache { margin-top: 16px; padding: 14px; border: 3px dashed var(--vert); border-radius: 16px; display: grid; gap: 8px; }
  .ajout-tache h3 { margin: 0; color: var(--vert); }
  .ajout-tache .ligne-admin { border: none; padding: 0; display: block; }
  .ajout-tache .ligne-admin input[data-champ=nom] { width: 100%; }
  .legende-couleurs { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85em; color: var(--doux); margin: 4px 0 12px; }
  .legende-couleurs span::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legende-couleurs .lt::before { background: var(--accent); }
  .legende-couleurs .lf::before { background: var(--jaune); }
  @media (min-width: 1000px) {
    .accueil-titre .date, .entete .date { display: none; }        /* la date est déjà dans la colonne */
    .profils.petits { grid-template-columns: repeat(6, 1fr); }    /* les 6 profils sur une ligne */
  }
  /* Tablette en paysage de faible hauteur : tout tient sans défiler */
  @media (min-width: 1000px) and (max-height: 860px) {
    body { font-size: 17px; }
    .app { padding-top: 10px; padding-bottom: 96px; }
    .accueil-titre { margin-bottom: 4px; }
    .resume { margin-bottom: 6px; }
    .tableau td { padding: 7px 8px; }
    .profils.petits .profil { padding: 6px 4px; }
    .profils.petits .profil .avatar { width: 46px; height: 46px; font-size: 26px; }
    h2 { margin-bottom: .3em; }
    .cote { padding: 10px; gap: 8px; }
    .bloc { padding: 10px 12px; }
    .horloge { font-size: 2.6em; }
    .meteo-ico { font-size: 2em; }
    .meteo-temp { font-size: 1.7em; }
    .meteo-jours { margin-top: 8px; }
    .meteo-jours .ico { font-size: 1.3em; }
    .radios button { min-height: 46px; }
  }
  /* Routines (matin, soir, week-end) */
  .routine-titre { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .etape { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 56px; margin-top: 8px; padding: 8px 14px;
           border-radius: 14px; border: 2px solid var(--bord); background: var(--carte); font-weight: 600; }
  .etape .coche { width: 34px; height: 34px; flex: none; border-radius: 10px; border: 3px solid var(--bord); display: grid; place-items: center; font-weight: 700; }
  .etape.cochee { background: var(--vert-fond); border-color: var(--vert); }
  .etape.cochee .coche { background: var(--vert); border-color: var(--vert); color: #fff; }
  .etape:disabled { cursor: default; }
  .puce.dispense { background: var(--alt); color: var(--doux); }
  .ligne-routine { padding: 6px 0; border-bottom: 2px solid var(--bord); }
  .ligne-routine:last-child { border-bottom: none; }
  .ligne-routine .actions .bouton { min-height: 44px; padding: 6px 12px; }
  .resume .resume-routine { background: var(--carte); border: 2px solid var(--bord); display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mini { display: inline-flex; align-items: center; gap: 3px; }

    .resume span { font-size: .8em; padding: 2px 10px; } .resume .resume-routine { gap: 6px; } .titre-profils { margin-top: 10px; margin-bottom: 4px; } .bouton-recap { min-height: 38px; } }
  /* Économiseur d'écran */

<script>
/* ===== Accès au serveur (Apps Script) — avec un mode démo pour l'aperçu ===== */
// Page servie par Google : google.script.run. Page servie ailleurs (GitHub Pages) : appel de l'API par fetch.
// L'adresse du serveur n'est PAS écrite dans ce fichier (dépôt public) : elle arrive une fois par le lien
// d'installation (…#api=IDENTIFIANT) puis reste gardée sur la tablette.
// Identifiant lu dans l'adresse (?api=… ou #api=…) à chaque ouverture, sinon dans la mémoire de la tablette
function extraireApi(texte) { var m = String(texte || '').match(/api=([A-Za-z0-9_-]{20,})/) || String(texte || '').match(/\/s\/([A-Za-z0-9_-]{20,})\/exec/); return m ? m[1] : null; }
var API = (function () {
  var id = extraireApi(location.search) || extraireApi(location.hash);
  if (id) { try { localStorage.setItem('api', id); } catch (e) {} return id; }
  try { return localStorage.getItem('api'); } catch (e) { return null; }
})();
function urlApi() { return /^https?:/.test(API) ? API : 'https://script.google.com/macros/s/' + API + '/exec'; }
function srv(nom) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) {
    if (window.google && google.script && google.script.run) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
      r[nom].apply(r, args);
    } else if (API) {
      // text/plain : pas de requête préalable CORS, ce qu'Apps Script accepte
      fetch(urlApi(), { method: 'POST', body: JSON.stringify({ fn: nom, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
        .then(function (r) { return r.json(); })
        .then(function (rep) { if (rep.ok) ok(rep.data); else ko(new Error(rep.erreur || 'Erreur')); })
        .catch(function () { ko(new Error('Pas de connexion. Vérifie le Wi-Fi.')); });
    } else {
      ko(new Error('non-configure'));
    }
  });
}

/* ===== Stockage local (profil choisi sur cette tablette) ===== */
function lireLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function ecrireLocal(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

var S = {
  etat: null,
  profil: lireLocal('profil'),
  vue: 'taches',
  pin: null,              // gardé en mémoire seulement pendant la session
  dernierVu: Number(lireLocal('msgVus') || 0),
  edition: false,
  derniere: Number(lireLocal('activite') || 0)
};

/* ===== Outils ===== */
var JOURS_COURTS = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dateLongue(iso) {
  var p = iso.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)).toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
}
function heure(iso) {
  var d = new Date(iso);
  var auj = new Date();
  var memeJour = d.toDateString() === auj.toDateString();
  return memeJour ? d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' })
                  : d.toLocaleDateString('fr-BE', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
}
function membre(nom) { return (S.etat.membres.filter(function (m) { return m.nom === nom; })[0]) || { nom: nom, couleur: '#888', emoji: '🙂', role: '' }; }
function avatar(nom, m2) {
  var m = m2 || membre(nom);
  var dedans = m.photo ? '<img src="' + esc(m.photo) + '" alt="">' : esc(m.emoji);
  return '<span class="avatar" style="background:' + esc(m.couleur) + '22;border:2px solid ' + esc(m.couleur) + '">' + dedans + '</span>';
}
function pastille(nom) {
  if (!nom) return '<span class="pastille">—</span>';
  var m = membre(nom);
  return '<span class="pastille" style="background:' + esc(m.couleur) + '1f">' + avatar(nom) + esc(nom) + '</span>';
}
function suivi(date, id) { return S.etat.suivi[date + '|' + id] || { fait: false, valide: false, repris: false, personne: '' }; }
// Qui fait réellement la tâche ce jour-là (celle qui l'a reprise, sinon celle de la rotation)
function quiFait(t, date) { var s = suivi(date, t.id); return (s.repris && s.personne) ? s.personne : t.personne; }
function pts(nom) { return (S.etat.points || {})[nom] || 0; }
function retraitsDe(nom) { return (S.etat.retraits || []).filter(function (r) { return r.personne === nom; }).reverse(); }
function bonusDe(nom) { return (S.etat.bonus || []).filter(function (r) { return r.personne === nom; }).reverse(); }
function mesBonus(nom, max) {
  var r = bonusDe(nom).slice(0, max);
  if (!r.length) return '';
  return '<div style="margin-top:10px"><b style="font-size:.9em">Points bonus</b>' + r.map(function (x) {
    return '<div class="legende"><span class="plus">+' + x.points + '</span> ' + esc(x.motif || 'bonus') + ' · ' + esc(heure(x.quand)) + '</div>';
  }).join('') + '</div>';
}
function mesRetraits(nom, max) {
  var r = retraitsDe(nom).slice(0, max);
  if (!r.length) return '';
  return '<div style="margin-top:10px"><b style="font-size:.9em">Points retirés</b>' + r.map(function (x) {
    return '<div class="legende"><span class="moins">−' + x.points + '</span> ' + esc(x.motif || 'sans motif') + ' · ' + esc(heure(x.quand)) + '</div>';
  }).join('') + '</div>';
}
function barrePoints(nom) {
  var p = pts(nom), seuil = S.etat.seuil || 10, pct = Math.max(0, Math.min(100, Math.round(p / seuil * 100)));
  return '<div class="barre' + (p >= seuil ? ' pleine' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="' + seuil + '" aria-valuenow="' + p + '"><span style="width:' + pct + '%"></span></div>';
}
function toast(t) {
  var d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600);
}
function estParent() { return membre(S.profil).role === 'parent'; }
function tachesActives() { return S.etat.taches.filter(function (t) { return t.active; }).sort(function (a, b) { return a.ordre - b.ordre; }); }

/* ===== Routines (matin, soir, week-end) ===== */
var MOMENTS_LIB = {
  matin:   { ico: '☀️', nom: 'Routine du matin', court: 'Matin' },
  soir:    { ico: '🌙', nom: 'Routine du soir', court: 'Soir' },
  weekend: { ico: '🧹', nom: 'Routine du week-end', court: 'Week-end' }
};
function lesFilles() { return S.etat.membres.filter(function (m) { return m.role === 'fille'; }); }
function routinesDe(moment) { return (S.etat.routines || []).filter(function (r) { return r.active && r.moment === moment; }).sort(function (a, b) { return a.ordre - b.ordre; }); }
function suiviRoutine(periode, moment, nom) { return (S.etat.suiviRoutines || {})[periode + '|' + moment + '|' + nom] || { cochees: [], valide: '', dispense: false, close: false }; }
function etatRoutine(p, nom) {
  var items = routinesDe(p.moment), s = suiviRoutine(p.periode, p.moment, nom);
  var n = items.filter(function (r) { return s.cochees.indexOf(r.id) >= 0; }).length;
  return { items: items, s: s, n: n, total: items.length, complete: items.length > 0 && n === items.length };
}
function periodesDuJour() { return (S.etat.periodes || []).filter(function (p) { return routinesDe(p.moment).length; }); }
// Routine à montrer sur l'accueil : le matin jusqu'à 13 h, le soir ensuite
function periodeEnCours() {
  var ps = periodesDuJour(); if (!ps.length) return null;
  var de = function (m) { return ps.filter(function (p) { return p.moment === m; })[0]; };
  if (de('soir') && (new Date().getHours() >= 13 || (!de('matin') && !de('weekend')))) return de('soir');
  return de('matin') || de('weekend') || ps[0];
}
function libEtatRoutine(e, court) {
  if (e.s.valide) return { cls: 'valide', txt: '⭐' + (court ? '' : ' Validée') };
  if (e.s.dispense) return { cls: 'dispense', txt: '💤' + (court ? '' : ' Dispensée') };
  if (e.complete) return { cls: 'attente', txt: '⏳' + (court ? '' : ' À valider') };
  return { cls: 'afaire', txt: e.n + '/' + e.total };
}
function dateCourte(iso) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)).toLocaleDateString('fr-BE', { day: 'numeric', month: 'long', timeZone: 'UTC' }); }
function libPeriode(m) { return m.moment === 'weekend' ? 'week-end du ' + dateCourte(m.periode) : dateLongue(m.periode); }
function manqueesDe(nom) { return (S.etat.manquees || []).filter(function (m) { return m.personne === nom; }); }
function mesManquees(nom, max) {
  var r = manqueesDe(nom).slice(0, max);
  if (!r.length) return '';
  return '<div style="margin-top:10px"><b style="font-size:.9em">Routines pas faites</b>' + r.map(function (m) {
    return '<div class="legende"><span class="moins">−1</span> ' + MOMENTS_LIB[m.moment].ico + ' ' + esc(MOMENTS_LIB[m.moment].nom) + ' · ' + esc(libPeriode(m)) + '</div>';
  }).join('') + '</div>';
}

// Une fille coche une étape : affichage immédiat, puis envoi au serveur (dans l'ordre)
var fileRoutines = Promise.resolve();
function cocherRoutineLocal(moment, id) {
  var p = (S.etat.periodes || []).filter(function (x) { return x.moment === moment; })[0];
  if (!p) return;
  var qui = S.profil, k = p.periode + '|' + moment + '|' + qui;
  S.etat.suiviRoutines = S.etat.suiviRoutines || {};
  var s = S.etat.suiviRoutines[k] || { cochees: [], valide: '', dispense: false, close: false };
  if (s.valide || s.dispense) return;
  var coche = s.cochees.indexOf(id) < 0;
  s.cochees = coche ? s.cochees.concat([id]) : s.cochees.filter(function (x) { return x !== id; });
  S.etat.suiviRoutines[k] = s;
  rendre();
  S.envois = (S.envois || 0) + 1;
  fileRoutines = fileRoutines.then(function () { return srv('cocherRoutine', qui, moment, id, coche); })
    .then(function (e) { S.envois--; if (!S.envois) appliquer(e); },
          function (err) { S.envois--; erreur(err); charger(); });
}

function vueMesRoutines() {
  var ps = periodesDuJour();
  if (!ps.length) return '';
  return '<h2>Mes routines</h2>' +
    ps.map(function (p) {
      var e = etatRoutine(p, S.profil), m = MOMENTS_LIB[p.moment], l = libEtatRoutine(e);
      var bloque = !!(e.s.valide || e.s.dispense);
      return '<div class="carte routine"><div class="routine-titre"><b>' + m.ico + ' ' + m.nom + (p.moment === 'weekend' ? ' <span class="legende">(samedi ou dimanche)</span>' : '') + '</b>' +
        '<span class="puce ' + l.cls + '">' + l.txt + '</span></div>' +
        e.items.map(function (r) {
          var c = e.s.cochees.indexOf(r.id) >= 0;
          return '<button class="etape' + (c ? ' cochee' : '') + '" data-action="cocherRoutine" data-moment="' + p.moment + '" data-id="' + esc(r.id) + '"' + (bloque ? ' disabled' : '') +
            ' aria-pressed="' + c + '"><span class="coche" aria-hidden="true">' + (c ? '✓' : '') + '</span>' + esc(r.nom) + '</button>';
        }).join('') +
        (e.complete && !bloque ? '<div class="legende">Bravo ! Papa ou maman va valider ta routine.</div>' : '') + '</div>';
    }).join('');
}

// Page d'un parent : routines du jour et routines pas validées (rattrapage)
function sectionRoutinesParent(auth) {
  var ps = periodesDuJour(), fl = lesFilles(), html = '', nbFinies = 0;
  var attr = function (p, nom, v) { return ' data-periode="' + p.periode + '" data-moment="' + p.moment + '" data-nom="' + esc(nom) + '" data-v="' + v + '"'; };
  if (ps.length) {
    html += '<h2>Routines d\'aujourd\'hui</h2><div class="carte">';
    ps.forEach(function (p, ip) {
      var m = MOMENTS_LIB[p.moment];
      html += '<h3' + (ip ? ' style="margin-top:14px"' : '') + '>' + m.ico + ' ' + m.nom + '</h3>' + fl.map(function (f) {
        var e = etatRoutine(p, f.nom), l = libEtatRoutine(e);
        var reste = e.items.filter(function (r) { return e.s.cochees.indexOf(r.id) < 0; }).map(function (r) { return r.nom; });
        var btn = '';
        if (auth) {
          if (e.s.valide) btn = '<button class="bouton leger" data-action="validerRoutine"' + attr(p, f.nom, 0) + '>Annuler</button>';
          else if (e.s.dispense) btn = '<button class="bouton leger" data-action="dispenserRoutine"' + attr(p, f.nom, 0) + '>Annuler la dispense</button>';
          else {
            if (e.complete) nbFinies++;
            btn = '<button class="bouton ' + (e.complete ? 'vert' : 'leger') + '" data-action="validerRoutine"' + attr(p, f.nom, 1) + (e.complete ? ' data-rv="1"' : '') + '>✓ Valider</button>' +
                  '<button class="bouton leger" data-action="dispenserRoutine"' + attr(p, f.nom, 1) + '>💤 Dispenser</button>';
          }
        }
        return '<div class="ligne-qui ligne-routine"><span>' + pastille(f.nom) + ' <span class="puce ' + l.cls + '">' + l.txt + '</span>' +
          (reste.length && e.n && !e.s.valide && !e.s.dispense ? '<span class="legende" style="display:block;margin:2px 0 0">Reste : ' + esc(reste.join(', ')) + '</span>' : '') +
          '</span><span class="actions">' + btn + '</span></div>';
      }).join('');
    });
    if (nbFinies > 1) html += '<button class="bouton" style="margin-top:10px" data-action="toutValiderRoutines">Valider les ' + nbFinies + ' routines finies</button>';
    html += '<p class="legende">Les filles cochent les étapes, vous validez la routine. Les routines ne retirent aucun point toutes seules : si besoin, utilisez « − Retirer » plus bas.</p></div>';
  }
  return html;
}

function grilleRoutines() {
  if (!(S.etat.routines || []).some(function (r) { return r.active; })) return '';
  var pj = S.etat.periodesJours || {}, auj = S.etat.aujourdhui;
  var enCours = function (p) { return (S.etat.periodes || []).some(function (x) { return x.moment === p.moment && x.periode === p.periode; }); };
  return '<h2>Routines de la semaine</h2><div class="carte grille-wrap"><table class="grille"><tr><th></th>' +
    S.etat.jours.map(function (j, i) { return '<th class="' + (j === auj ? 'jour-actuel' : '') + '">' + JOURS_COURTS[i] + '<br>' + (+j.slice(8)) + '</th>'; }).join('') + '</tr>' +
    lesFilles().map(function (f) {
      return '<tr><td class="tache-nom">' + esc(f.nom) + '</td>' + S.etat.jours.map(function (j) {
        var cell = (pj[j] || []).filter(function (p) { return routinesDe(p.moment).length; }).map(function (p) {
          var e = etatRoutine(p, f.nom);
          var sym = e.s.valide ? '⭐' : e.s.dispense ? '💤' : e.s.close ? '✗' : e.complete ? '⏳' : enCours(p) ? e.n + '/' + e.total : (j < auj ? '·' : '');
          return '<span class="mr">' + MOMENTS_LIB[p.moment].ico + '<b>' + sym + '</b></span>';
        }).join('');
        return '<td class="cellule-routine' + (j === auj ? ' jour-actuel' : '') + '">' + cell + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</table><div class="legende">☀️ matin · 🌙 soir · 🧹 week-end — ⭐ validée · ⏳ finie, à valider · ✗ pas validée · 💤 dispensée</div></div>';
}

function ligneRoutine(r) {
  return '<div class="ligne-admin' + (r.active ? '' : ' inactive') + '" data-rligne="' + esc(r.id) + '">' +
    '<span class="num" aria-hidden="true">' + MOMENTS_LIB[r.moment].ico + '</span>' +

}
function optionsMoment(sel) {

}
function carteAdminRoutines() {

        '<div class="liste-taches">' + (rs.length ? rs.map(ligneRoutine).join('') : '<div class="legende">Aucune étape.</div>') + '</div>';
    }).join('') +

    '<input data-champ="nom" placeholder="Ex. : Se brosser les dents" aria-label="Nom de la nouvelle étape">' +

    '<option value="lun-ven"' + (S.etat.soirJours !== 'dim-jeu' ? ' selected' : '') + '>du lundi au vendredi</option>' +
    '<option value="dim-jeu"' + (S.etat.soirJours === 'dim-jeu' ? ' selected' : '') + '>du dimanche au jeudi (veille d\'école)</option></select></div></div>';
}
function lireRoutine(id) {
  var l = document.querySelector('[data-rligne="' + id + '"]');
  var g = function (c) { return l.querySelector('[data-champ="' + c + '"]'); };
  return { id: id, nom: g('nom').value, moment: g('moment').value, active: g('active') ? g('active').checked : true };
}

/* ===== Expiration de la session après inactivité ===== */
function dureeExpiration() { var e = S.etat ? S.etat.expiration : 60; return (e === undefined || e === null) ? 60 : Number(e); }
function noterActivite() {
  var t = Date.now();
  if (t - S.derniere > 2000) ecrireLocal('activite', String(t));   // gardé pour la réouverture de l'appli
  S.derniere = t;
}
// Photo en cours (appareil photo ou galerie ouverts) : on ne déconnecte pas et on ne redessine pas la page,
// sinon la photo choisie arrive sur un champ qui n'existe plus
function photoEnCours() { return S.photoDepuis && Date.now() - S.photoDepuis < 5 * 60000; }
document.addEventListener('click', function (ev) {
  if (ev.target.closest && ev.target.closest('label[for="fichierPhoto"], #fichierPhoto')) S.photoDepuis = Date.now();
}, true);
function sessionExpiree() {
  if (photoEnCours()) return false;
  var d = dureeExpiration();
  return d > 0 && Date.now() - S.derniere > d * 1000;
}
function deconnecter(message) {
  S.authParent = null; S.codes = null; S.codesCharges = false; S.voirCodes = false;
  S.profil = null; S.saisieCode = null; S.saisiePin = false; S.code = ''; S.retrait = null; S.bonusPour = null; S.edition = false; S.pin = null; S.vue = 'taches';
  ecrireLocal('profil', null); rendre(); window.scrollTo(0, 0);
  if (message) toast(message);
}
function verifierExpiration() {
  if (!S.etat) return;
  if ((S.profil || S.saisieCode) && sessionExpiree()) deconnecter(S.profil ? 'Session terminée : choisis ton profil' : '');
}
['click', 'touchstart', 'keydown', 'input', 'scroll'].forEach(function (t) {
  document.addEventListener(t, function () { if (!S.profil || !sessionExpiree()) noterActivite(); }, { passive: true, capture: true });
});
setInterval(verifierExpiration, 5000);

/* ===== Chargement ===== */
function appliquer(etat) {
  var premier = !S.etat;
  S.etat = etat;
  if (premier && S.profil && sessionExpiree()) { S.profil = null; ecrireLocal('profil', null); }   // appli rouverte après un long moment
  rendre();
}
function erreur(e) { toast((e && e.message) ? e.message : 'Oups, réessaie'); }
function charger() {
  return srv('getEtat').then(function (e) { if (!S.envois) appliquer(e); }).catch(function (e) {
    if (e && e.message === 'non-configure') {
      if (document.getElementById('lienInstall')) return;   // ne pas effacer une saisie en cours
      document.getElementById('app').innerHTML = '<div class="carte" style="margin-top:40px"><h2>Appli pas encore installée sur cet appareil</h2>' +
        '<p>Colle ici le lien d\'installation donné par les parents :</p>' +
        '<form data-form="installer"><div class="champ"><input id="lienInstall" autocomplete="off" placeholder="https://…api=…" aria-label="Lien d\'installation"></div>' +
        '<button class="bouton" type="submit">Installer</button></form></div>';
      return;
    }
    toast('Pas de connexion. Vérifie le Wi-Fi.');
  });
}

/* ===== Rendu ===== */
function rendre() {
  var app = document.getElementById('app');
  if (!S.etat) return;
  if (typeof majDetailFille === 'function') majDetailFille();
  var nomsValides = S.etat.membres.map(function (m) { return m.nom; });
  if (!S.profil || nomsValides.indexOf(S.profil) < 0) {
    S.profil = null;
    app.innerHTML = (S.saisieCode && nomsValides.indexOf(S.saisieCode) >= 0) ? (S.saisiePin ? vueCodeParents() : vueClavier()) : vueProfils();
    cacherBas(true); return;
  }
  cacherBas(false);
  if ((S.vue === 'parents' || S.vue === 'profil' || S.vue === 'taches') && S.edition) return;   // ne pas effacer une saisie en cours
  if (S.vue === 'profil' && photoEnCours()) return;   // appareil photo ouvert
  var html = entete();
  if (S.vue === 'taches') html += vueTaches();
  if (S.vue === 'semaine') html += vueSemaine();
  if (S.vue === 'messages') html += vueMessages();
  if (S.vue === 'parents') html += vueParents();
  if (S.vue === 'profil') html += vueProfil();
  app.innerHTML = html;
  document.getElementById('saisie').classList.toggle('cache', S.vue !== 'messages');
  document.body.classList.toggle('avec-saisie', S.vue === 'messages');
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('actif', b.dataset.vue === S.vue); });
  majBadge();
  if (S.vue === 'messages') {
    if (S.etat.messages.length !== S.nbMsg) window.scrollTo(0, document.body.scrollHeight);
    S.nbMsg = S.etat.messages.length; marquerLus();
  } else S.nbMsg = -1;
}

function cacherBas(c) {
  document.getElementById('nav').classList.toggle('cache', c);
  document.body.classList.toggle('sans-nav', c);   // accueil : pas de barre d'onglets, donc pas de marge en bas
  if (c) document.getElementById('saisie').classList.add('cache');
}

function entete() {
  return '<div class="entete"><div><h1 style="font-size:1.3em;margin:0">Tâches de la maison</h1>' +
    '<div class="date">' + esc(dateLongue(S.etat.aujourdhui)) + '</div></div>' +
    '<div class="droite"><button class="moi" data-action="ouvrirProfil" aria-label="Mon profil">' + avatar(S.profil) + '<b>' + esc(S.profil) + '</b></button>' +
    '<button class="changer" data-action="changerProfil" aria-label="Changer de profil">🔄 Changer</button></div></div>';
}

function vueProfils() {
  return tableauAccueil() + '<div class="titre-profils"><h2>Qui es-tu ?</h2><button class="bouton leger bouton-recap" data-action="recapPoints">🏆 Points</button></div><div class="profils petits">' +
    S.etat.membres.map(function (m) {
      return '<button class="profil" data-action="choisirProfil" data-nom="' + esc(m.nom) + '" style="border-color:' + esc(m.couleur) + '">' +
             avatar(m.nom) + esc(m.nom) + (m.aCode ? ' 🔒' : '') + '</button>';
    }).join('') + '</div>' +
    '<div class="phrase-jour">' + esc(phraseDuJour(new Date())) + '</div>';
}

// Accueil : récapitulatif du jour, visible sans se connecter
function tableauAccueil() {
  var auj = S.etat.aujourdhui, t = tachesActives();
  var nbValide = 0, nbAttente = 0;
  var lignes = t.map(function (x) {
    var s = suivi(auj, x.id), qui = quiFait(x, auj);
    if (s.valide) nbValide++; else if (s.fait) nbAttente++;
    var etat = s.valide ? '<span class="puce valide">⭐<span class="lib"> Validé</span></span>'
      : s.fait ? '<span class="puce attente">⏳<span class="lib"> Fait</span></span>'
      : '<span class="puce afaire">○<span class="lib"> À faire</span></span>';
    var quiHtml = pastille(qui) + (s.repris ? ' 🤝' : '');
    return '<tr class="' + (s.fait ? 'fini' : '') + '"><td class="t-nom">' + esc(x.nom) + '<div class="qui-mobile">' + quiHtml + '</div></td><td class="t-qui">' + quiHtml + '</td><td class="t-etat">' + etat + '</td></tr>';
  });
  var reste = t.length - nbValide - nbAttente;
  var pc = periodeEnCours(), chipR = '';
  if (pc) chipR = '<span class="resume-routine">' + MOMENTS_LIB[pc.moment].ico + ' ' + MOMENTS_LIB[pc.moment].court + lesFilles().map(function (f) {
    var l = libEtatRoutine(etatRoutine(pc, f.nom), true);
    return '<button class="mini" data-action="voirFille" data-nom="' + esc(f.nom) + '" aria-label="Ce qui reste à faire pour ' + esc(f.nom) + '">' + avatar(f.nom) + l.txt + '</button>';
  }).join('') + '</span>';
  return '<div class="accueil-titre"><h1>Aujourd\'hui</h1><span class="date">' + esc(dateLongue(auj)) + '</span>' +
    '</div>' +
    (t.length || chipR ? '<div class="resume">' + chipR + (!t.length ? '' :
      (reste ? '<span style="background:var(--fond);border:2px dashed var(--bord)">○ ' + reste + ' à faire</span>' : '<span style="background:var(--vert-fond);color:var(--vert)">🎉 Tout est fait !</span>') +
      (nbAttente ? '<span style="background:var(--jaune-fond);color:var(--jaune)">⏳ ' + nbAttente + ' à valider</span>' : '') +
      (nbValide ? '<span style="background:var(--vert-fond);color:var(--vert)">⭐ ' + nbValide + ' validée' + (nbValide > 1 ? 's' : '') + '</span>' : '')) + '</div>' : '') +
    '<div class="carte" style="padding:6px 14px">' + (t.length ? '<table class="tableau">' + lignes.join('') + '</table>' : '<div class="vide">Aucune tâche aujourd\'hui.</div>') + '</div>';
}

function vueClavier() {
  var n = S.code.length;
  return '<div class="clavier' + (S.secoue ? ' secoue' : '') + '">' + avatar(S.saisieCode) + '<h2>' + esc(S.saisieCode) + '</h2><p>Tape ton code secret</p>' +
    '<div class="points-code" aria-label="' + n + ' chiffres tapés sur 4">' + [0, 1, 2, 3].map(function (i) { return '<span class="' + (i < n ? 'plein' : '') + '"></span>'; }).join('') + '</div>' +
    '<div class="touches">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'annuler', '0', 'efface'].map(function (k) {
      if (k === 'annuler') return '<button data-action="annulerCode" style="font-size:.8em">Retour</button>';
      if (k === 'efface') return '<button data-action="toucheCode" data-k="efface" aria-label="Effacer">⌫</button>';
      return '<button data-action="toucheCode" data-k="' + k + '">' + k + '</button>';
    }).join('') + '</div><p class="legende">Code oublié ? Demande à papa ou maman de l\'effacer.</p></div>';
}
// Entrée d'un parent qui n'a pas encore de code sur son profil
function vueCodeParents() {
  return '<div class="clavier">' + avatar(S.saisieCode) + '<h2>' + esc(S.saisieCode) + '</h2>' +
    '<form data-form="entreeParent"><div class="champ"><label for="codeParentsEntree">Tape le code parents</label>' +
    '<input id="codeParentsEntree" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="text-align:center;font-size:1.4em;letter-spacing:.3em"></div>' +
    '<div class="actions" style="justify-content:center"><button class="bouton" type="submit">Entrer</button><button class="bouton leger" type="button" data-action="annulerCode">Retour</button></div></form>' +
    '<p class="legende">Astuce : crée ton propre code secret dans ton profil (touche ton prénom en haut) ; ensuite, il suffira de taper tes 4 chiffres.</p></div>';
}
function connecter(nom) { noterActivite(); ecrireLocal('activite', String(S.derniere)); S.profil = nom; S.saisieCode = null; S.code = ''; ecrireLocal('profil', nom); S.vue = 'taches'; rendre(); }

function carteTache(t, date, montrerQui) {
  var s = suivi(date, t.id);
  var qui = quiFait(t, date);
  var repriseParAutre = !montrerQui && s.repris && s.personne && s.personne !== S.profil;
  var repriseParMoi = !montrerQui && s.repris && s.personne === S.profil;
  var action;
  if (montrerQui) {
    // Vue parent : on affiche l'état, sans bouton (c'est à la fille de cocher)
    if (s.valide) action = '<span class="etat valide">⭐ Validé</span>';
    else if (s.fait) action = '<span class="etat attente">⏳ Fait, à valider</span>';
    else action = '<span class="etat afaire">○ Pas encore fait</span>';
  } else if (repriseParAutre) action = '<span class="etat valide">💛 Reprise par ' + esc(s.personne) + '</span>';
  else if (s.valide) action = '<span class="etat valide">⭐ Validé</span>';
  else if (s.fait) action = '<span class="etat attente">⏳ Fait, en attente</span> <button class="bouton leger" data-action="defaire" data-id="' + t.id + '" data-qui="' + esc(qui) + '">Annuler</button>';
  else action = '<button class="bouton vert" data-action="fait" data-id="' + t.id + '" data-qui="' + esc(qui) + '">✓ J\'ai fini</button>' +
    (repriseParMoi ? ' <button class="bouton leger" data-action="rendre" data-id="' + t.id + '">Rendre</button>' : '');
  var sousTitre = '';
  if (montrerQui) sousTitre = '<span class="qui">' + esc(qui || 'personne') + (s.repris ? ' 🤝 (reprise à ' + esc(t.personne) + ')' : '') + '</span>';
  else if (repriseParMoi) sousTitre = '<span class="note-reprise">🤝 Tu la reprends à ' + esc(t.personne) + '</span>';
  else if (t.type === 'tournante') sousTitre = '<div class="prochaine">' + (S.etat.frequence > 1 ? 'À la prochaine rotation' : 'Semaine prochaine') + ' : ' + esc(t.personneSuivante) + '</div>';
  return '<div class="carte"><div class="tache"><div class="nom">' + esc(t.nom) + sousTitre + '</div>' + action + '</div></div>';
}

function vueTaches() {
  var auj = S.etat.aujourdhui;
  if (estParent()) return vueTableauParent();
  var actives = tachesActives();
  var p = pts(S.profil), seuil = S.etat.seuil || 10;
  var html = '<div class="carte"><div class="points"><span class="score">⭐ ' + p + ' / ' + seuil + '</span>' + barrePoints(S.profil) + '</div>' +
    (p >= seuil ? '<div class="gagne">🎁 Tu as gagné une récompense ! Va voir papa ou maman.</div>'
                : '<div class="legende">Encore ' + (seuil - p) + ' point' + (seuil - p > 1 ? 's' : '') + ' avant ta récompense. 1 tâche validée = +1 point.</div>') +
    mesBonus(S.profil, 3) + mesRetraits(S.profil, 3) + '</div>';
  html += vueMesRoutines();

  var miennes = actives.filter(function (t) { return t.personne === S.profil; });
  var reprises = actives.filter(function (t) { var s = suivi(auj, t.id); return t.personne !== S.profil && s.repris && s.personne === S.profil; });
  html += '<h2>Mes tâches de la semaine</h2>';
  if (!miennes.length && !reprises.length) html += '<div class="carte vide">🎉 Pas de tâche pour toi cette semaine !</div>';
  html += miennes.map(function (t) { return carteTache(t, auj, false); }).join('');
  html += reprises.map(function (t) { return carteTache(t, auj, false); }).join('');
  var aFaire = miennes.filter(function (t) { return quiFait(t, auj) === S.profil; }).concat(reprises);
  if (aFaire.length && aFaire.every(function (t) { return suivi(auj, t.id).fait; })) html += '<div class="carte vide" style="color:var(--vert);font-weight:600">Bravo, tout est fait pour aujourd\'hui ! 👏</div>';

  // Tâches des autres qu'on peut reprendre aujourd'hui
  var aider = actives.filter(function (t) {
    var s = suivi(auj, t.id);
    return t.personne && t.personne !== S.profil && !s.fait && !s.repris;
  });
  if (aider.length) {
    html += '<h2>Reprendre une tâche</h2><p class="legende" style="margin-top:-6px">Une sœur est absente ou débordée ? Reprends sa tâche d\'aujourd\'hui : si elle est validée, le point est pour toi.</p>' +
      aider.map(function (t) {
        return '<div class="carte"><div class="tache"><div class="nom">' + esc(t.nom) + '<span class="qui">' + esc(t.personne) + '</span></div>' +
          '<button class="bouton leger" data-action="reprendre" data-id="' + t.id + '" data-de="' + esc(t.personne) + '">🤝 Je la reprends</button></div></div>';
      }).join('');
  }
  return html;
}

/* ===== Page d'un parent : validation et points ===== */
// Autorité envoyée au serveur : code du profil du parent, sinon code parents
function autorite() { return S.authParent && S.authParent.nom === S.profil ? S.authParent : (S.pin || null); }

function vueTableauParent() {
  var auj = S.etat.aujourdhui, t = tachesActives();
  if (!autorite()) {
    return '<h2>Validation et points</h2><div class="carte"><form data-form="pin"><div class="champ"><label for="pin">Tape le code parents pour valider et gérer les points</label>' +

  }

    t.forEach(function (x) { var s = suivi(j, x.id); if (s.fait && !s.valide) aValider.push({ j: j, t: x, qui: s.personne || x.personne, repris: s.repris }); });
  });
  var html = '<h2>À valider</h2><div class="carte">' + (aValider.length ? aValider.map(function (a) {

  }).join('') + (aValider.length > 1 ? '<button class="bouton" style="margin-top:8px" data-action="toutValider">Tout valider</button>' : '')
    : '<div class="vide">Rien à valider pour le moment.</div>') + '</div>';
  html += sectionRoutinesParent(true);

  html += '<h2>Aujourd\'hui</h2><div class="carte">' + (t.length ? t.map(function (x) {
    var s = suivi(auj, x.id), qf = quiFait(x, auj);

/* Réduit la photo à 160 × 160 px pour qu'elle reste légère */
function preparerPhoto(fichier) {
  return new Promise(function (ok, ko) {
    var lecteur = new FileReader();
    lecteur.onerror = ko;
    lecteur.onload = function () {
      var img = new Image();
      img.onerror = function () { ko(new Error('Image illisible')); };
      img.onload = function () {
        var c = document.createElement('canvas'), t = 160; c.width = t; c.height = t;
        var cote = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - cote) / 2, (img.height - cote) / 2, cote, cote, 0, 0, t, t);
        ok(c.toDataURL('image/jpeg', 0.75));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-vue], [data-action]');
  if (!b) return;
  if (b.dataset.vue) { S.codes = null; S.codesCharges = false; S.voirCodes = false; S.vue = b.dataset.vue; S.edition = false; rendre(); window.scrollTo(0, S.vue === 'messages' ? document.body.scrollHeight : 0); return; }
  var a = b.dataset.action, id = b.dataset.id;
  if (a === 'choisirProfil') {
    if (membre(b.dataset.nom).aCode) { S.saisieCode = b.dataset.nom; S.saisiePin = false; S.code = ''; S.secoue = false; rendre(); return; }
    // Parent sans code de profil : on demande le code parents, pour avoir les mêmes droits qu'un parent avec code
    if (membre(b.dataset.nom).role === 'parent') { S.saisieCode = b.dataset.nom; S.saisiePin = true; rendre(); var cp = document.getElementById('codeParentsEntree'); if (cp) cp.focus(); return; }
    // Vérifie quand même auprès du serveur (un code a pu être créé sur une autre tablette)
    var nomChoisi = b.dataset.nom;
    srv('entrerProfil', nomChoisi, '').then(function () { connecter(nomChoisi); })
      .catch(function () { S.saisieCode = nomChoisi; S.code = ''; S.secoue = false; rendre(); charger(); });
    return;
  }
  if (a === 'annulerCode') { S.saisieCode = null; S.saisiePin = false; S.code = ''; rendre(); return; }
  if (a === 'toucheCode') {
    S.secoue = false;
    if (b.dataset.k === 'efface') S.code = S.code.slice(0, -1);
    else if (S.code.length < 4) S.code += b.dataset.k;
    rendre();
    if (S.code.length === 4) {
      var qui = S.saisieCode, essai = S.code;
      srv('entrerProfil', qui, essai).then(function () { if (membre(qui).role === 'parent') S.authParent = { nom: qui, code: essai }; connecter(qui); })
        .catch(function (e) { S.code = ''; S.secoue = true; rendre(); toast((e && e.message) || 'Code incorrect'); });
    }
    return;
  }
  if (a === 'retirerCode') {

/* ===== Phase de la Lune (calcul astronomique, d'après la méthode de la bibliothèque SunCalc) ===== */
function phaseLune(date) {
  var rad = Math.PI / 180, e = rad * 23.4397, d = date.valueOf() / 86400000 - 0.5 + 2440588 - 2451545;
  function ra(l, b) { return Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l)); }
  function dec(l, b) { return Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l)); }
  var M = rad * (357.5291 + 0.98560028 * d);
  var Ls = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  var sDec = dec(Ls, 0), sRa = ra(Ls, 0);
  var L = rad * (218.316 + 13.176396 * d), Mm = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.229350 * d);
  var l = L + rad * 6.289 * Math.sin(Mm), b = rad * 5.128 * Math.sin(F), dist = 385001 - 20905 * Math.cos(Mm);
  var mDec = dec(l, b), mRa = ra(l, b), sDist = 149598000;
  var phi = Math.acos(Math.sin(sDec) * Math.sin(mDec) + Math.cos(sDec) * Math.cos(mDec) * Math.cos(sRa - mRa));
  var inc = Math.atan2(sDist * Math.sin(phi), dist - sDist * Math.cos(phi));
  var angle = Math.atan2(Math.cos(sDec) * Math.sin(sRa - mRa), Math.sin(sDec) * Math.cos(mDec) - Math.cos(sDec) * Math.sin(mDec) * Math.cos(sRa - mRa));
  var phase = 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI;   // 0 = nouvelle lune, 0,5 = pleine lune
  var noms = [['🌑', 'Nouvelle lune'], ['🌒', 'Premier croissant'], ['🌓', 'Premier quartier'], ['🌔', 'Gibbeuse croissante'],
              ['🌕', 'Pleine lune'], ['🌖', 'Gibbeuse décroissante'], ['🌗', 'Dernier quartier'], ['🌘', 'Dernier croissant']];
  // Les 4 phases principales (nouvelle, quartiers, pleine) : à ± 1 jour de leur moment ; entre les deux : croissant ou gibbeuse
  var jours = phase * 29.53, k = Math.round(jours / 7.3825), i = Math.abs(jours - k * 7.3825) <= 1 ? (2 * k) % 8 : (2 * Math.floor(jours / 7.3825) + 1) % 8;
  return { ico: noms[i][0], nom: noms[i][1], eclairee: Math.round((1 + Math.cos(inc)) / 2 * 100), phase: phase };
}

        var t = temps(m.current.weather_code), j = m.daily;
        window.meteoVeille = { ico: t[0], temp: Math.round(m.current.temperature_2m), txt: t[1], max: Math.round(j.temperature_2m_max[0]), min: Math.round(j.temperature_2m_min[0]), pluie: j.precipitation_probability_max[0] };
        var noms = ['Auj.', 'Demain', new Date(j.time[2] + 'T12:00').toLocaleDateString('fr-BE', { weekday: 'short' })];
        document.getElementById('meteo').className = '';
        document.getElementById('meteo').innerHTML =
          '<div class="meteo-maint"><span class="meteo-ico">' + t[0] + '</span><div><div class="meteo-temp">' + Math.round(m.current.temperature_2m) + '°</div>' +
          '<div class="legende" style="margin:2px 0 0">' + t[1] + ' · pluie ' + j.precipitation_probability_max[0] + ' %</div></div>' +
          (function () { var lu = phaseLune(new Date()); return '<div class="lune" title="' + lu.nom + ' · ' + lu.eclairee + ' % éclairée"><span class="ico-lune">' + lu.ico + '</span>' + lu.nom + '</div>'; })() + '</div>' +
          '<div class="meteo-jours">' + j.time.map(function (x, i) {
            return '<button type="button" data-meteo-jour="' + i + '" aria-label="Météo heure par heure : ' + noms[i] + '"><span>' + noms[i] + '</span><span class="ico">' + temps(j.weather_code[i])[0] + '</span><b>' + Math.round(j.temperature_2m_max[i]) + '°</b> / ' + Math.round(j.temperature_2m_min[i]) + '°' +
              (i === 0 ? '<span class="detail">heure par heure</span>' : '') + '</button>';
          }).join('') + '</div>';
        if (document.getElementById('fenetreMeteo')) ouvrirHeures(Number(document.getElementById('fenetreMeteo').dataset.jour));   // mise à jour si ouverte
      })
      .catch(function () { document.getElementById('meteo').textContent = 'Météo indisponible pour le moment'; });
  }
  meteo(); setInterval(meteo, 30 * 60 * 1000);

  // Fenêtre : détail heure par heure d'un jour (0 = aujourd'hui)
  function fermerHeures() { var f = document.getElementById('fenetreMeteo'); if (f) f.remove(); }
  function ouvrirHeures(i) {
    var m = donneesMeteo; if (!m || !m.hourly) return;
    var jour = m.daily.time[i], h = m.hourly, maintenant = new Date();
    var cle = maintenant.getFullYear() + '-' + pad(maintenant.getMonth() + 1) + '-' + pad(maintenant.getDate()) + 'T' + pad(maintenant.getHours());
    var titre = i === 0 ? "Aujourd'hui" : new Date(jour + 'T12:00').toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' });
    var lignes = '';
    h.time.forEach(function (t, k) {
      if (t.slice(0, 10) !== jour) return;
      var ico = temps(h.weather_code[k])[0];
      if (!h.is_day[k] && h.weather_code[k] <= 2) ico = h.weather_code[k] === 0 ? '🌙' : '☁️';
      var pp = h.precipitation_probability[k], mm = h.precipitation[k];
      var classe = t.slice(0, 13) === cle ? ' maintenant' : (t.slice(0, 13) < cle ? ' passee' : '');
      lignes += '<div class="heure-ligne' + classe + '"' + (classe === ' maintenant' ? ' id="heureMaintenant"' : '') + '>' +
        '<span class="h">' + t.slice(11, 13) + ' h</span><span class="i" aria-hidden="true">' + ico + '</span>' +
        '<span class="t">' + Math.round(h.temperature_2m[k]) + '°</span>' +
        '<span class="p"><span class="pluie-barre" aria-hidden="true"><span style="width:' + (pp || 0) + '%"></span></span>' +
        '💧 ' + (pp === null || pp === undefined ? '–' : pp + ' %') + (mm > 0 ? ' · ' + String(Math.round(mm * 10) / 10).replace('.', ',') + ' mm' : '') + '</span></div>';
    });
    var ancienne = document.getElementById('fenetreMeteo'), depuis = ancienne ? ancienne.dataset.ouverte : String(Date.now());
    fermerHeures();
    var v = document.createElement('div');
    v.className = 'voile'; v.id = 'fenetreMeteo'; v.dataset.jour = i; v.dataset.ouverte = depuis;
    v.innerHTML = '<div class="fenetre" role="dialog" aria-modal="true" aria-label="Météo heure par heure">' +
      '<div class="fenetre-tete"><h2>🌦️ ' + titre + ' · heure par heure</h2><button class="bouton leger" type="button" data-fermer-meteo="1">✕ Fermer</button></div>' +
      '<div class="heures">' + lignes + '</div></div>';
    document.body.appendChild(v);
    var n = document.getElementById('heureMaintenant');
    if (n) n.scrollIntoView({ block: 'center' });
  }
  document.getElementById('meteo').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-meteo-jour]'); if (b) ouvrirHeures(Number(b.dataset.meteoJour));
  });
  document.addEventListener('click', function (ev) {
    var f = document.getElementById('fenetreMeteo'); if (!f) return;
    if (ev.target === f || ev.target.closest('[data-fermer-meteo]')) fermerHeures();
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fermerHeures(); });
  // Se ferme seule après 2 minutes, pour ne pas rester ouverte sur la tablette
  setInterval(function () { var f = document.getElementById('fenetreMeteo'); if (f && Date.now() - Number(f.dataset.ouverte) > 120000) fermerHeures(); }, 15000);

  var APPLI_RADIO = 'de.radio.android';
  var lecteur = document.getElementById('lecteur'), enCours = null, essais = 0;
  function titre(t) { document.getElementById('radioTitre').textContent = t; }
  function afficherRadios() {
    document.getElementById('radios').innerHTML = RADIOS.map(function (r, i) {
      return '<button data-radio="' + i + '" class="' + (enCours === i ? 'joue' : '') + '">' + (enCours === i ? '⏹ ' : '📻 ') + r[0] + '</button>';
    }).join('');
  }
  function arreter() {
    lecteur.pause(); lecteur.removeAttribute('src'); lecteur.load();
    enCours = null; titre('Radio'); afficherRadios();
  }
  function jouer(i, auto) {
    enCours = i; afficherRadios(); titre('Connexion à ' + RADIOS[i][0] + '…');
    lecteur.src = RADIOS[i][1] + (RADIOS[i][1].indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();   // toujours le direct
    lecteur.play().then(function () { essais = 0; noterSon(); titre('🔊 ' + RADIOS[i][0] + ' · touche pour arrêter'); })
      .catch(function () { if (enCours === i) { enCours = null; afficherRadios(); titre(auto ? '▶ Touche ' + RADIOS[i][0] + ' pour lancer' : 'Impossible de lancer ' + RADIOS[i][0]); } });
  }

  function noterSon() { ecrireLocal('radioDernierSon', String(Date.now())); }
  setInterval(function () { if (enCours !== null && !lecteur.paused) noterSon(); }, 60000);
  document.getElementById('radios').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-radio]'); if (!b) return;
    var i = Number(b.dataset.radio);
    if (enCours === i) arreter(); else { essais = 0; if (enCours !== null) arreter(); jouer(i); }
  });
  // Coupure réseau : on relance la même station (3 essais)
  lecteur.addEventListener('error', function () {
    if (enCours === null || !lecteur.getAttribute('src')) return;
    if (essais < 3) { essais++; var i = enCours; setTimeout(function () { if (enCours === i) jouer(i); }, 3000); }
    else { enCours = null; afficherRadios(); titre('Radio coupée (connexion ?)'); }
  });
  lecteur.addEventListener('ended', function () { if (enCours !== null) jouer(enCours); });
  // Applis de musique : même forme de lien que celle qui ouvre bien radio.fr sur la tablette
  var APPLIS = {
    radio:   { site: 'www.radio.fr',      paquet: APPLI_RADIO }
  };
  document.querySelector('.applis').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-appli]'); if (!b) return;
    if (enCours !== null) arreter();   // évite deux musiques en même temps
    var a = APPLIS[b.dataset.appli];
    var intent = 'intent://' + a.site + '/#Intent;scheme=https;package=' + a.paquet + ';end';
    if (window.fully && typeof fully.startIntent === 'function') { fully.startIntent(intent); return; }
    location.href = intent;
  });
  afficherRadios();
})();

/* ===== Fenêtre : récapitulatif des points (tableau, puis détail d'une fille) ===== */
var recapDonnees = null;
var ICONES_POINTS = { tache: '✅', bonus: '🌟', retrait: '➖', recompense: '🎁', routine: '⏰' };
function dateRecap(q) {
  var d = q.length > 10 ? new Date(q) : new Date(q + 'T12:00');
  return d.toLocaleDateString('fr-BE', { weekday: 'short', day: 'numeric', month: 'short' });
}
function contenuRecap(nom) {
  var d = recapDonnees;
  if (!d) return '<div class="vide">Chargement…</div>';
  if (!nom) {
    return '<table class="tableau tableau-recap"><tr><th></th><th>Points</th><th>Gagnés</th><th>Perdus</th></tr>' + lesFilles().map(function (f) {
      var x = d[f.nom] || { total: 0, gagne: 0, perdu: 0 };
      return '<tr class="cliquable" data-action="recapFille" data-nom="' + esc(f.nom) + '"><td>' + pastille(f.nom) + '</td><td><b>⭐ ' + x.total + '</b></td>' +
        '<td class="plus">+' + x.gagne + '</td><td class="moins">−' + x.perdu + '</td></tr>';
    }).join('') + '</table><p class="legende">Touche une fille pour voir le détail. « Perdus » compte aussi les points échangés contre une récompense 🎁.</p>';
  }
  var x = d[nom] || { total: 0, gagne: 0, perdu: 0, evenements: [] };
  return '<div class="resume-recap"><span>⭐ <b>' + x.total + '</b> points</span><span class="plus">+' + x.gagne + ' gagnés</span><span class="moins">−' + x.perdu + ' perdus</span></div>' +
    (x.evenements.length ? x.evenements.map(function (e) {
      return '<div class="ligne-recap"><span class="ico" aria-hidden="true">' + (ICONES_POINTS[e.type] || '•') + '</span><span class="txt">' + esc(e.texte) +
        '<span class="legende" style="display:block;margin:0">' + esc(dateRecap(e.quand)) + '</span></span><b class="' + (e.points > 0 ? 'plus' : 'moins') + '">' + (e.points > 0 ? '+' : '−') + Math.abs(e.points) + '</b></div>';
    }).join('') : '<div class="vide">Pas encore de points.</div>');
}
function ouvrirRecap(nom) {
  var f = document.getElementById('fenetreRecap');
  if (!f) {
    f = document.createElement('div'); f.className = 'voile'; f.id = 'fenetreRecap';
    document.body.appendChild(f);
    recapDonnees = null;
    srv('historiquePoints').then(function (d) { recapDonnees = d; majRecap(); }).catch(function (e) { erreur(e); fermerRecap(); });
  }
  f.dataset.nom = nom || ''; f.dataset.ouverte = String(Date.now());
  majRecap();
}
function majRecap() {
  var f = document.getElementById('fenetreRecap'); if (!f) return;
  var nom = f.dataset.nom || null;
  f.innerHTML = '<div class="fenetre" role="dialog" aria-modal="true" aria-label="Récapitulatif des points">' +
    '<div class="fenetre-tete">' + (nom ? '<h2>' + avatar(nom) + ' ' + esc(nom) + '</h2>' : '<h2>🏆 Récapitulatif des points</h2>') +
    '<span class="actions">' + (nom ? '<button class="bouton leger" type="button" data-action="recapRetour">◀ Tableau</button>' : '') +
    '<button class="bouton leger" type="button" data-action="fermerRecap">✕ Fermer</button></span></div>' +
    '<div class="detail-fille">' + contenuRecap(nom) + '</div></div>';
}
function fermerRecap() { var f = document.getElementById('fenetreRecap'); if (f) f.remove(); recapDonnees = null; }
document.addEventListener('click', function (ev) { var f = document.getElementById('fenetreRecap'); if (f && ev.target === f) fermerRecap(); });
setInterval(function () { var f = document.getElementById('fenetreRecap'); if (f && Date.now() - Number(f.dataset.ouverte) > 180000) fermerRecap(); }, 15000);

/* ===== Fenêtre : ce qu'il reste à faire pour une fille (depuis l'accueil) ===== */
function contenuDetailFille(nom) {
  var auj = S.etat.aujourdhui, html = '';
  periodesDuJour().forEach(function (p) {
    var e = etatRoutine(p, nom), l = libEtatRoutine(e), m = MOMENTS_LIB[p.moment];
    html += '<h3>' + m.ico + ' ' + m.nom + ' <span class="puce ' + l.cls + '">' + l.txt + '</span></h3>' +
      e.items.map(function (r) {
        var c = e.s.cochees.indexOf(r.id) >= 0;
        return '<div class="etape' + (c ? ' cochee' : '') + '"><span class="coche" aria-hidden="true">' + (c ? '✓' : '') + '</span>' + esc(r.nom) + (c ? '' : ' <b style="margin-left:auto;color:var(--rouge)">pas encore fait</b>') + '</div>';
      }).join('');
  });
  var mesTaches = tachesActives().filter(function (t) { return quiFait(t, auj) === nom; });
  html += '<h3>📋 Tâches de la semaine (aujourd\'hui)</h3>' + (mesTaches.length ? mesTaches.map(function (t) {
    var s = suivi(auj, t.id);
    var etat = s.valide ? '<span class="puce valide">⭐ Validé</span>' : s.fait ? '<span class="puce attente">⏳ Fait</span>' : '<span class="puce afaire">○ Pas encore fait</span>';
    return '<div class="ligne-tache"><b>' + esc(t.nom) + (s.repris ? ' 🤝' : '') + '</b>' + etat + '</div>';
  }).join('') : '<p class="legende">Pas de tâche de la semaine aujourd\'hui.</p>');
  return html;
}
function ouvrirDetailFille(nom) {
  fermerDetailFille();
  var v = document.createElement('div');
  v.className = 'voile'; v.id = 'detailFille'; v.dataset.nom = nom; v.dataset.ouverte = String(Date.now());
  v.innerHTML = '<div class="fenetre" role="dialog" aria-modal="true" aria-label="Ce qui reste à faire pour ' + esc(nom) + '">' +
    '<div class="fenetre-tete"><h2>' + avatar(nom) + ' ' + esc(nom) + '</h2><button class="bouton leger" type="button" data-action="fermerDetail">✕ Fermer</button></div>' +
    '<div class="detail-fille">' + contenuDetailFille(nom) + '</div></div>';
  document.body.appendChild(v);
}
function fermerDetailFille() { var f = document.getElementById('detailFille'); if (f) f.remove(); }
function majDetailFille() { var f = document.getElementById('detailFille'); if (f && S.etat) f.querySelector('.detail-fille').innerHTML = contenuDetailFille(f.dataset.nom); }
document.addEventListener('click', function (ev) { var f = document.getElementById('detailFille'); if (f && ev.target === f) fermerDetailFille(); });
setInterval(function () { var f = document.getElementById('detailFille'); if (f && Date.now() - Number(f.dataset.ouverte) > 120000) fermerDetailFille(); }, 15000);

/* ===== Économiseur d'écran : grande horloge après un temps sans toucher l'écran ===== */
function delaiVeille() { var v = S.etat ? S.etat.veille : 5; return (v === undefined || v === null) ? 5 : Number(v); }
var dernierToucher = Date.now(), veilleOuverte = false, veillePos = 0;
['click', 'touchstart', 'keydown', 'input', 'scroll', 'mousemove'].forEach(function (t) {
  document.addEventListener(t, function () { if (!veilleOuverte) dernierToucher = Date.now(); }, { passive: true, capture: true });
});
function contenuVeille() {
  var d = new Date(), pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var m = window.meteoVeille, html = '<div class="veille-heure">' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + '</div>' +
    '<div class="veille-date">' + esc(d.toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' })) + oeufHtml(d) + '</div>' +
    '<div class="veille-phrase">' + esc(phraseDuJour(d)) + '</div>';
  if (m) html += '<div class="veille-meteo"><span class="ico">' + m.ico + '</span><b>' + m.temp + '°</b><span class="txt">' + esc(m.txt) + '<br>' + m.max + '° / ' + m.min + '° · pluie ' + m.pluie + ' %</span></div>';
  var pc = S.etat && typeof periodeEnCours === 'function' ? periodeEnCours() : null;
  if (pc) html += '<div class="veille-routine">' + MOMENTS_LIB[pc.moment].ico + ' ' + MOMENTS_LIB[pc.moment].court + lesFilles().map(function (f) {
    return '<span class="mini">' + avatar(f.nom) + libEtatRoutine(etatRoutine(pc, f.nom), true).txt + '</span>';
  }).join('') + '</div>';
  return html;
}
// Le bloc change de place chaque minute, pour ne pas marquer l'écran
var POSITIONS_VEILLE = [[50, 45], [38, 35], [62, 58], [40, 60], [60, 36], [50, 55]];
function majVeille(bouger) {
  var v = document.getElementById('veille'); if (!v) return;
  var b = v.querySelector('.veille-bloc');
  b.innerHTML = contenuVeille();
  if (bouger) { veillePos = (veillePos + 1) % POSITIONS_VEILLE.length; }
  b.style.left = POSITIONS_VEILLE[veillePos][0] + '%'; b.style.top = POSITIONS_VEILLE[veillePos][1] + '%';
}
function ouvrirVeille() {
  if (veilleOuverte) return;
  veilleOuverte = true;
  var f = document.getElementById('fenetreMeteo'); if (f) f.remove();
  fermerDetailFille(); fermerRecap();
  var v = document.createElement('div');
  v.className = 'veille'; v.id = 'veille'; v.setAttribute('role', 'button'); v.setAttribute('aria-label', 'Touche l\'écran pour revenir');
  v.innerHTML = '<div class="veille-bloc"></div><div class="veille-aide">Touche l\'écran pour revenir</div>';
  document.body.appendChild(v);
  veillePos = 0; majVeille(false);
}
function fermerVeille() {
  var v = document.getElementById('veille'); if (v) v.remove();
  veilleOuverte = false; dernierToucher = Date.now();
}
// Le toucher qui réveille l'écran ne doit rien activer d'autre
var finVeille = 0;
['pointerdown', 'touchstart', 'mousedown', 'pointerup', 'touchend', 'mouseup', 'click'].forEach(function (t) {
  document.addEventListener(t, function (ev) {
    if (veilleOuverte) {
      ev.preventDefault(); ev.stopPropagation();
      if (t === 'pointerdown' || t === 'touchstart' || t === 'mousedown') { fermerVeille(); finVeille = Date.now(); }
    } else if (Date.now() - finVeille < 800) { ev.preventDefault(); ev.stopPropagation(); }   // fin du même toucher
  }, { capture: true, passive: false });
});
setInterval(function () {
  var d = delaiVeille();
  if (!veilleOuverte && d > 0 && S.etat && Date.now() - dernierToucher > d * 60000) ouvrirVeille();
  else if (veilleOuverte && d === 0) fermerVeille();
}, 5000);
setInterval(function () { if (veilleOuverte) majVeille(true); }, 60000);
setInterval(function () { if (veilleOuverte) majVeille(false); }, 15000);

/* Mise à jour en direct : toutes les 10 secondes quand l'écran est visible */
setInterval(function () { if (!document.hidden) charger(); }, 10000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) { verifierExpiration(); charger(); } });
charger();
</script>
